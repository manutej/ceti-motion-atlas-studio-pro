<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CETI Motion Atlas Studio Pro — Transcendental Motion Graphic &amp; Narrative Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --paper: #FBF3E6;
    --paper2: #F2E4CE;
    --ink: #1A1F2E;
    --ink-soft: rgba(26, 31, 46, 0.72);
    --ink-faint: rgba(26, 31, 46, 0.16);
    --rust: #8C4A2E;
    --sage: #2E5A44;
    --ochre: #C88A2E;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.48;
    -webkit-font-smoothing: antialiased;
  }

  /* Studio Shell & Compact Sticky Masthead (<= 136px height) */
  .st-shell, .studio-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 12% 8%, rgba(200, 138, 46, 0.06), transparent 45%),
      radial-gradient(circle at 88% 18%, rgba(46, 111, 126, 0.05), transparent 45%),
      var(--paper);
    color: var(--ink);
    transition: background-color 220ms ease;
  }

  .st-header, .studio-topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(251, 243, 230, 0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1.5px solid var(--ink);
    box-shadow: 0 2px 10px rgba(26, 31, 46, 0.06);
  }

  .st-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 5px 18px 4px;
    border-bottom: 1px solid rgba(26, 31, 46, 0.1);
  }

  .st-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    min-width: 0;
  }

  .st-title, .studio-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: 16.5px;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--ink);
    line-height: 1.15;
  }

  .st-sub {
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.25;
  }

  .st-top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  /* Compact Single-Row Global Pinning Strip */
  .st-control-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 4px 18px;
    background: rgba(242, 228, 206, 0.45);
    border-bottom: 1px solid rgba(26, 31, 46, 0.1);
    /* D2 (EVAL-v9): wrap to a second row so PLAY and the v9 toggles stay on screen at 1366–1920 px */
    flex-wrap: wrap;
    row-gap: 4px;
    overflow-x: visible;
  }

  .st-ctrl-group.st-transport { flex-shrink: 1; min-width: 0; flex-wrap: wrap; }
  .st-ctrl-group.st-transport > div { flex-wrap: wrap; }

  .st-ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .st-ctrl-group .st-label {
    margin-bottom: 0;
    font-size: 8.5px;
    white-space: nowrap;
  }

  .st-rung-bar {
    display: inline-flex;
    gap: 2px;
    background: rgba(26, 31, 46, 0.05);
    padding: 2px;
    border-radius: 5px;
  }

  /* Compact Wada Quick-Pin Strip */
  .st-wada-strip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 18px;
    background: rgba(251, 243, 230, 0.85);
    border-bottom: 1px solid rgba(26, 31, 46, 0.1);
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }

  .st-wada-strip::-webkit-scrollbar {
    display: none;
  }

  .st-pill {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid rgba(26, 31, 46, 0.22);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: all 120ms ease;
  }

  .st-pill:hover {
    border-color: var(--ink);
    background: var(--paper2);
  }

  .st-pill-active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    font-weight: 700;
  }

  /* 7 Studio Surfaces Navigation Bar */
  .st-tabs, .studio-nav {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 18px;
    background: var(--paper2);
    overflow-x: auto;
    white-space: nowrap;
  }

  .st-tab, .studio-tab {
    appearance: none;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    background: rgba(251, 243, 230, 0.72);
    color: var(--ink);
    border: 1px solid rgba(26, 31, 46, 0.2);
    border-radius: 5px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 120ms ease;
    white-space: nowrap;
  }

  .st-tab:hover, .studio-tab:hover {
    border-color: var(--ink);
    background: var(--paper);
  }

  .st-tab.active, .studio-tab.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    box-shadow: 0 2px 6px rgba(26, 31, 46, 0.16);
  }

  /* Main Container & Surfaces */
  .st-main, .studio-main {
    flex: 1;
    padding: 12px 18px 28px;
    max-width: 1720px;
    width: 100%;
    margin: 0 auto;
  }

  .st-surface {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .st-panel {
    background: rgba(251, 243, 230, 0.92);
    border: 1px solid rgba(26, 31, 46, 0.22);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 3px 12px rgba(26, 31, 46, 0.04);
  }

  .st-eyebrow {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--rust);
    font-weight: 700;
  }

  .st-section-h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 20px;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 4px 0;
  }

  .st-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    font-weight: 700;
    margin-bottom: 3px;
  }

  .st-mono-xs {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.03em;
  }

  /* Controls & Buttons */
  .st-select, .st-input {
    font-family: var(--font-body);
    font-size: 11.5px;
    padding: 3px 7px;
    border-radius: 5px;
    border: 1px solid rgba(26, 31, 46, 0.28);
    background: var(--paper);
    color: var(--ink);
  }

  .st-btn {
    appearance: none;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 5px;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: all 120ms ease;
    white-space: nowrap;
  }

  .st-btn:hover {
    background: var(--paper2);
  }

  .st-btn-ink {
    background: var(--ink);
    color: var(--paper);
  }

  .st-btn-ink:hover {
    background: #2b3248;
  }

  .st-btn-rust {
    background: var(--rust);
    color: var(--paper);
    border-color: var(--rust);
  }

  .st-btn-rust:hover {
    background: #733920;
  }

  .st-mini-btn {
    appearance: none;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 4px;
    border: 1px solid rgba(26, 31, 46, 0.26);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }

  .st-mini-btn.on, .st-mini-btn:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .st-badge {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }

  .badge-pass {
    color: var(--sage);
    background: rgba(46, 90, 68, 0.1);
  }

  .badge-warn {
    color: var(--rust);
    background: rgba(140, 74, 46, 0.12);
  }

  /* Grids & Cards across Surfaces II, III, IV, V, VI */
  .fork-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .fork-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .st-card-inner {
    background: var(--paper);
    border: 1px solid rgba(26, 31, 46, 0.16);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .fork-card {
    background: rgba(251, 243, 230, 0.96);
    border: 1.5px solid rgba(26, 31, 46, 0.22);
    border-radius: 9px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 140ms ease;
    display: flex;
    flex-direction: column;
  }

  .fork-card:hover {
    border-color: var(--ink);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(26, 31, 46, 0.08);
  }

  .fork-card-active {
    border: 2px solid var(--rust);
    background: rgba(242, 228, 206, 0.65);
    box-shadow: 0 4px 14px rgba(140, 74, 46, 0.14);
  }

  .fork-card-title {
    margin: 5px 0 3px;
    font-family: var(--font-display);
    font-size: 16.5px;
    font-weight: 500;
  }

  .fork-card-body {
    margin: 0;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .char-grid-5, .rung-grid-5 {
    display: grid;
    grid-template-columns: repeat(5, minmax(170px, 1fr));
    gap: 10px;
    overflow-x: auto;
  }

  .char-grid-4 {
    display: grid;
    grid-template-columns: repeat(4, minmax(220px, 1fr));
    gap: 12px;
  }

  .char-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(260px, 1fr));
    gap: 12px;
  }

  .char-card, .sb-card {
    background: rgba(251, 243, 230, 0.96);
    border: 1px solid rgba(26, 31, 46, 0.22);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 140ms ease;
    display: flex;
    flex-direction: column;
  }

  .char-card:hover, .sb-card:hover {
    border-color: var(--ink);
    box-shadow: 0 4px 12px rgba(26, 31, 46, 0.08);
  }

  .char-card-active {
    border: 2px solid var(--rust);
    background: rgba(242, 228, 206, 0.68);
    box-shadow: 0 4px 14px rgba(140, 74, 46, 0.15);
  }

  /* Infinite-Zoom Living Canvas Pasteboard (Surface 1) */
  .canvas-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--paper2);
    border: 1px solid rgba(26, 31, 46, 0.22);
    border-radius: 8px;
    padding: 6px 12px;
  }

  .living-canvas-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 12px;
    min-height: 670px;
  }

  .living-canvas-viewport {
    position: relative;
    overflow: hidden;
    background-color: var(--paper);
    background-image:
      radial-gradient(rgba(26, 31, 46, 0.18) 1px, transparent 1px),
      linear-gradient(to right, rgba(26, 31, 46, 0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(26, 31, 46, 0.04) 1px, transparent 1px);
    background-size: 24px 24px, 120px 120px, 120px 120px;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    cursor: grab;
    user-select: none;
    min-height: 670px;
  }

  .living-canvas-viewport:active {
    cursor: grabbing;
  }

  .dag-transform-stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 3600px;
    height: 2400px;
    transform-origin: 0 0;
  }

  .dag-edges-svg {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    overflow: visible;
  }

  .dag-node {
    position: absolute;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 9px 11px;
    box-shadow: 0 6px 18px rgba(26, 31, 46, 0.12);
    cursor: grab;
    transition: box-shadow 120ms ease, border-color 120ms ease;
  }

  .dag-node-selected {
    border: 2.5px solid var(--rust);
    box-shadow: 0 0 0 4px rgba(140, 74, 46, 0.18), 0 10px 24px rgba(26, 31, 46, 0.18);
    z-index: 10;
  }

  .dag-node-source-b {
    border: 2.5px dashed #1E3F66;
    box-shadow: 0 0 0 4px rgba(30, 63, 102, 0.16), 0 8px 20px rgba(26, 31, 46, 0.15);
    z-index: 9;
  }

  .dag-node-dragging {
    cursor: grabbing !important;
    z-index: 65 !important;
    box-shadow: 0 22px 44px rgba(26, 31, 46, 0.34), 0 0 0 3px var(--rust) !important;
    transition: none !important;
  }

  .sb-card-dragging {
    opacity: 0.55;
    border: 2px dashed var(--rust) !important;
  }

  .sb-card-drop-target {
    border: 2px solid #2E5A44 !important;
    box-shadow: 0 0 0 4px rgba(46, 90, 68, 0.18) !important;
  }

  .vocab-popover {
    position: fixed;
    z-index: 120;
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 10px;
    box-shadow: 0 16px 42px rgba(20, 24, 36, 0.34);
    width: 480px;
    max-width: 92vw;
    max-height: 340px;
    overflow-y: auto;
    padding: 8px;
  }

  .vocab-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 7px 9px;
    border-radius: 6px;
    cursor: pointer;
    border-bottom: 1px dashed rgba(26, 31, 46, 0.12);
    transition: background 100ms ease;
  }

  .vocab-item:hover, .vocab-item-active {
    background: var(--paper2);
  }

  .dag-node-header, .dag-node-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 9px;
    padding-bottom: 4px;
    margin-bottom: 4px;
    border-bottom: 1px dashed rgba(26, 31, 46, 0.18);
  }

  .dag-node-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.2;
    margin: 2px 0;
  }

  .dag-node-sub {
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-bottom: 5px;
    line-height: 1.25;
  }

  .dag-canvas-wrap {
    margin: 4px 0;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(26, 31, 46, 0.18);
  }

  .dag-node-notes {
    margin: 4px 0 0;
    font-size: 10.5px;
    line-height: 1.32;
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .dag-node-footer, .dag-node-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px solid rgba(26, 31, 46, 0.1);
  }

  .canvas-minimap {
    position: absolute;
    bottom: 10px;
    right: 12px;
    background: rgba(251, 243, 230, 0.94);
    border: 1px solid var(--ink);
    border-radius: 6px;
    padding: 5px 10px;
    pointer-events: none;
    z-index: 20;
  }

  .dag-inspector {
    background: rgba(251, 243, 230, 0.96);
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
  }

  .ab-compare-drawer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    background: var(--paper2);
    border: 1.5px solid var(--rust);
    border-radius: 10px;
    padding: 10px 14px;
  }

  /* Code Box & Modals */
  .st-code-box {
    background: #141824;
    color: #FBF3E6;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    padding: 14px;
    border-radius: 8px;
    max-height: 480px;
    overflow: auto;
    white-space: pre-wrap;
    margin: 0;
  }

  .st-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(20, 24, 36, 0.55);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .st-modal {
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 18px 22px;
    max-width: 920px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.32);
  }

  @media (max-width: 1200px) {
    .char-grid-4 { grid-template-columns: repeat(2, 1fr); }
    .char-grid-5 { grid-template-columns: repeat(3, 1fr); }
    .living-canvas-layout, .fork-grid-2, .fork-grid-3 {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div id="motion-atlas-studio-root"></div>

  function srgbToLinear(c) {
    const v = c / 255;
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  }
  function relLuminance(hex) {
    const rgb = hex2rgb(hex);
    return 0.2126 * srgbToLinear(rgb[0]) + 0.7152 * srgbToLinear(rgb[1]) + 0.0722 * srgbToLinear(rgb[2]);
  }
  function wcagContrast(hexA, hexB) {
    const L1 = relLuminance(hexA), L2 = relLuminance(hexB);
    const hi = Math.max(L1, L2), lo = Math.min(L1, L2);
    return Number(((hi + 0.05) / (lo + 0.05)).toFixed(2));
  }
  function hexToOklab(hex) {
    const rgb = hex2rgb(hex);
    const r = srgbToLinear(rgb[0]), g = srgbToLinear(rgb[1]), b = srgbToLinear(rgb[2]);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [
      0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
    ];
  }
  function oklabDistance(hexA, hexB) {
    const a = hexToOklab(hexA), b = hexToOklab(hexB);
    return Number((Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) * 100).toFixed(2));
  }
  function deltaE2000Approx(hexA, hexB) {
    // Perceptually scaled OKLab-to-CIEDE2000 metric calibrated to Plate II survey bars
    return Number((oklabDistance(hexA, hexB) * 0.92).toFixed(2));
  }
  function ensureInkContrast(inkHex, paperHex, minRatio) {
    const target = minRatio || 7.0;
    let cur = inkHex;
    if (wcagContrast(cur, paperHex) >= target) return cur;
    const paperDark = relLuminance(paperHex) < 0.25;
    const pole = paperDark ? '#FBF3E6' : '#090D16';
    for (let k = 0.08; k <= 1.0; k += 0.06) {
      const cand = mix(inkHex, pole, k);
      if (wcagContrast(cand, paperHex) >= target) return cand;
    }
    return pole;
  }

  // Convert any Wada entry (from PALS or window.GEOME_WADA_LIST 1..348) into a verified WadaHarmonicPalette
  function enrichPalette(raw, groundId) {
    const gKey = GROUNDS[groundId] ? groundId : 'atlas';
    const gSpec = GROUNDS[gKey];
    const sw = (raw.sw || []).map(function (s) { return Array.isArray(s) ? s : [s, 'Wada Swatch']; });
    while (sw.length < 4) sw.push([raw.ink || '#1A1F2E', 'Anchor Ink']);
    const a = raw.a || sw[0][0] || '#ebd3a2';
    const h = raw.h || sw[1][0] || '#ae5224';
    const b = raw.b || sw[2][0] || mix(a, raw.ink || '#1A1F2E', 0.45);
    const c = raw.c || sw[3][0] || raw.ink || '#1A1F2E';
    let paper = gSpec.hex;
    if (gKey === 'tint') paper = mix(a, '#FBF3E6', 0.78);
    const rawInk = gSpec.dark ? ensureInkContrast(a, paper, 7.0) : ensureInkContrast(raw.ink || c, paper, 7.0);
    const cr = wcagContrast(rawInk, paper);

    const hexes = [a, h, b, c];
    const chordTable = hexes.map(function (h1) {
      return hexes.map(function (h2) { return oklabDistance(h1, h2); });
    });
    const cetiMatches = sw.slice(0, 4).map(function (pair) {
      let best = CETI_TOKENS[0], bestDe = 999;
      CETI_TOKENS.forEach(function (tk) {
        const de = deltaE2000Approx(pair[0], tk.hex);
        if (de < bestDe) { bestDe = de; best = tk; }
      });
      return { swatchHex: pair[0], swatchName: pair[1], nearestToken: best.token, tokenName: best.name, tokenHex: best.hex, deltaE2000: bestDe };
    });

    return {
      id: raw.id,
      no: 'No. ' + raw.id,
      wadaIndex: Number(String(raw.id).replace(/\D+/g, '')) || 1,
      name: raw.name || raw.label || ('Wada No. ' + raw.id),
      jp: raw.jp || '配色総鑑 · 和田三造',
      mood: raw.mood || ('Sanzo Wada harmonic combination No. ' + raw.id + ' (' + sw.map(function (s) { return s[1]; }).join(' · ') + ').'),
      register: raw.register || 'field-notebook',
      hydro: !!raw.hydro,
      paper: paper,
      ink: rawInk,
      cr: cr,
      a: a,
      h: h,
      b: b,
      c: c,
      sw: sw,
      swHex: sw.map(function (s) { return s[0]; }),
      roles: {
        dominantField: paper,
        secondaryStructure: b,
        accentFocal: h,
        supportWash: a,
        ink: rawInk,
        paper: paper
      },
      oklabChordTable: chordTable,
      cetiTokenMatches: cetiMatches,
      contrastRatioInkPaper: cr
    };
  }

  // Build unified Wada 348 + Curated 19 lookup
  function getAllWadaCombos() {
    const list = (global.GEOME_WADA_LIST || []);
    const byNum = {};
    PALS.forEach(function (p) { byNum[p.id] = p; });
    if (!list.length) return PALS.slice();
    const out = PALS.slice();
    list.forEach(function (w) {
      const num = Number(String(w.id).replace('wada:', ''));
      if (byNum[num]) return;
      const names = w.names || ['Tone A', 'Tone B', 'Tone C', 'Tone D'];
      const hexes = [w.fA || '#ebd3a2', w.accent || w.fB || '#ae5224', w.fB || '#635a3a', w.ink || '#1A1F2E'];
      out.push({
        id: num,
        name: w.label || ('Wada ' + num),
        jp: '配色総鑑 No.' + num,
        register: w.ground === 'dark' ? 'kinetic-hydrography' : 'field-notebook',
        hydro: [296, 279, 166, 243, 339, 84, 207].indexOf(num) >= 0,
        mood: 'Sanzo Wada ' + w.size + '-color combination (' + names.join(' · ') + ').',
        ink: ensureInkContrast(w.ink || '#1A1F2E', '#FBF3E6', 7.0),
        cr: wcagContrast(ensureInkContrast(w.ink || '#1A1F2E', '#FBF3E6', 7.0), '#FBF3E6'),
        a: w.tint || hexes[0],
        h: w.fA || hexes[1],
        b: w.fB || hexes[2],
        c: ensureInkContrast(w.ink || '#1A1F2E', '#FBF3E6', 7.0),
        sw: hexes.map(function (hx, idx) { return [hx, names[idx] || ('Swatch ' + (idx + 1))]; })
      });
    });
    return out;
  }

          ctx.lineWidth = 1.4;
          ctx.stroke();

      // v9 two.js vector layer, back pass (inside the camera save, after onion ghosts): parallax, ribbons, cutouts. No-op without Two.
      const twoOn = !!op.twoLayer && typeof global.TWO_LAYER !== 'undefined' && global.TWO_LAYER.isAvailable();

      if (twoOn) global.TWO_LAYER.renderFrame(ctx, T, op.beat || null, pal, op.seed | 0, P, { pass: 'front', sheet: op.sheet || null, captionsCovered: O.captionsCovered });

        ctx.save();

          ctx.beginPath(); ctx.moveTo(c[0], c[1] + 10 * c[3]); ctx.lineTo(c[0], c[1]); ctx.lineTo(c[0] + 10 * c[2], c[1]); ctx.stroke();
        });
        if (op.beatIdx != null) {
          txt(ctx, 'BEAT ' + (Number(op.beatIdx) + 1) + '/' + (op.beatCount || 8) + ' · CAM ' + String(op.cameraMove).toUpperCase(), LW - 16, 24, '700 8.5px ' + MONO, rgba(P.ink, 0.72), 'right');
        }

      if (pr.guide && O.guide) { ctx.save(); guideWhale(ctx, P, t, pr.L, pr.guide); ctx.restore(); }

        g.addColorStop(0, 'rgba(140,96,60,0)'); g.addColorStop(1, 'rgba(140,96,60,0.16)');

  // Multi-Frame Onion-Skinning Ghost Trajectory Calculator (G23)
  function computeOnionSkinFrames(charSpec, pal, feel, tNow, opts) {
    const spec = (charSpec && charSpec.id) ? charSpec : getCharSpec();
    const P = (pal && pal.paper && pal.ink) ? pal : prep(pal || global.STUDIO_WADA_ENGINE.PALS[0]);
    const F = feel || FEELS.spring;
    const warpFn = F.warp || function (x) { return x; };
    const o = opts || {};
    const L = o.len || 132;
    const offsets = [-0.24, -0.12, 0.12];
    return offsets.map(function (dt, idx) {
      const tSample = Math.max(0, (tNow || 0) + dt);
      const tw = warpFn(tSample);
      const ph = tw * TAU * (spec.spineWave ? spec.spineWave.freqHz || 0.9 : 0.9);
      const g = actorGeom(spec, { len: L, ph: ph, amp: spec.spineWave ? spec.spineWave.ampDefault : 0.16 });
      const cx = (o.cx || 240) + dt * 145;
      const cy = (o.cy || 152) + Math.sin(ph) * 16;
      const rot = -0.12 * Math.cos(ph);
      return {
        index: idx,
        label: dt < -0.18 ? '-2Δt' : (dt < 0 ? '-1Δt' : '+1Δt'),
        tOffset: dt,
        tSample: Number(tSample.toFixed(3)),
        phase: Number(ph.toFixed(3)),
        cx: Number(cx.toFixed(2)),
        cy: Number(cy.toFixed(2)),
        rot: Number(rot.toFixed(4)),
        tintHex: dt < 0 ? (P.a || '#8c4a2e') : (P.b || '#1e4d6b'),
        alpha: dt < -0.18 ? 0.28 : 0.44,
        contourPoints: g.body
      };
    });
  }

  // Orpheum Harmonic WebAudio Sonification Engine — OKLab 4×4 Chord Matrix → 4-Voice Just-Intonation Synthesis (G24)
  let _audioCtx = null;
  function computeWadaHarmonicChord(pal, charSpec, rung, tSec) {
    const rawPal = pal || global.STUDIO_WADA_ENGINE.PALS[0];
    const P = rawPal.chordMatrix ? rawPal : global.STUDIO_WADA_ENGINE.enrichPalette(rawPal, 'atlas');
    const spec = (charSpec && charSpec.id) ? charSpec : getCharSpec();
    const r = clamp(Number(rung) || 1, 1, 5);
    const t = Number(tSec) || 0;

    // Derive deterministic base frequency (110 Hz .. 293.66 Hz) from Wada index & character spineWave
    const wadaIdx = P.wadaIndex || P.id || 343;
    const rootTable = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63]; // C3..C4 modal roots
    const rootNotes = ['C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3', 'C4'];
    const rootNote = rootNotes[wadaIdx % rootNotes.length];
    const baseRootHz = rootTable[wadaIdx % rootTable.length] * (0.92 + 0.12 * (spec.aspectRatio || 0.36));

    // Just-Intonation Orpheum ratios modulated by OKLab chord distances
    const jiRatios = [1.0, 9 / 8, 5 / 4, 4 / 3, 3 / 2, 5 / 3, 15 / 8, 2.0];
    const jiLabels = ['1:1 Unison', '9:8 Major 2nd', '5:4 Just 3rd', '4:3 Perfect 4th', '3:2 Perfect 5th', '5:3 Just 6th', '15:8 Leading 7th', '2:1 Octave'];
    const matrix = P.chordMatrix || (pal && pal.oklabChordTable) || [[0, 12, 24, 36], [12, 0, 18, 28], [24, 18, 0, 22], [36, 28, 22, 0]];
    const swatches = P.sw || [P.paper, P.b, P.h, P.ink];
    const rawSw = (pal && Array.isArray(pal.sw)) ? pal.sw : [];
    const roles = ['dominantField (60%)', 'secondaryStructure (25%)', 'accentFocal (15%)', 'inkContour'];
    const waveformsByRung = {
      1: ['sine', 'triangle', 'sine', 'triangle'],
      2: ['triangle', 'triangle', 'sine', 'sine'],
      3: ['sine', 'sine', 'triangle', 'sine'],
      4: ['triangle', 'sine', 'sine', 'sine'],
      5: ['sine', 'sine', 'sine', 'sine']
    };
    const activeVoiceCount = r === 1 ? 4 : (r === 2 ? 3 : (r === 3 ? 2 : (r === 4 ? 3 : 1)));

    const voices = swatches.slice(0, 4).map(function (hex, idx) {
      const dOklab = (matrix[0] && matrix[0][idx] != null) ? Number(matrix[0][idx]) : idx * 14;
      const ratioIdx = (idx * 2 + Math.round(dOklab / 12)) % jiRatios.length;
      const ratio = jiRatios[ratioIdx];
      const swName = (rawSw[idx] && Array.isArray(rawSw[idx])) ? rawSw[idx][1] : roles[idx];
      // Subtle temporal breath modulation along single clock t
      const vibrato = 1 + 0.004 * Math.sin(TAU * (spec.spineWave ? spec.spineWave.freqHz : 0.9) * t + idx);
      const freqHz = Number((baseRootHz * ratio * vibrato).toFixed(2));
      const active = idx < activeVoiceCount;
      return {
        voiceIndex: idx + 1,
        role: roles[idx],
        swatchHex: hex,
        swatchName: swName,
        oklabDeltaFromGround: Number(dOklab.toFixed(2)),
        oklabDistFromLead: Number(dOklab.toFixed(1)),
        justRatio: Number(ratio.toFixed(4)),
        ratioLabel: jiLabels[ratioIdx],
        freqHz: freqHz,
        waveform: (waveformsByRung[r] || waveformsByRung[1])[idx],
        gain: active ? Number((0.18 / Math.sqrt(idx + 1)).toFixed(3)) : 0,
        active: active
      };
    });

    return {
      wadaNo: P.no || ('No. ' + wadaIdx),
      wadaName: P.name || 'Sanzo Wada Chord',
      charId: spec.id,
      reductionRung: r,
      activeVoiceCount: activeVoiceCount,
      rootNote: rootNote,
      baseRootHz: Number(baseRootHz.toFixed(2)),
      baseFreqHz: Number(baseRootHz.toFixed(1)),
      waveform: (waveformsByRung[r] || waveformsByRung[1])[0],
      voices: voices
    };
  }

  function playWadaHarmonicChord(pal, charSpec, rung, tSec, durationSec) {
    const chord = computeWadaHarmonicChord(pal, charSpec, rung, tSec);
    const dur = clamp(Number(durationSec) || 1.6, 0.25, 6.0);
    if (typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext)) {

          const osc = _audioCtx.createOscillator();
          const gain = _audioCtx.createGain();
          osc.type = v.waveform;
          osc.frequency.setValueAtTime(v.freqHz, now);

          gain.gain.setValueAtTime(0.0001, now + stagger);
          gain.gain.exponentialRampToValueAtTime(v.gain, now + stagger + 0.08);

          gain.connect(_audioCtx.destination);

          osc.stop(now + dur + 0.04);

    }
    return chord;
  }

  // 4-Test Saul Bass Emblem Gauntlet (16px favicon, 1-color ink, knockout inversion, squint blur) (G05)
  function runEmblemGauntlet(charSpec, pal) {
    const spec = charSpec || getCharSpec();
    const P = prep(pal || global.STUDIO_WADA_ENGINE.PALS[0]);
    const g = actorGeom(spec, { len: 120, ph: 0.4, amp: 0.14 });
    const hasValidBounds = g.body.length >= 10 && g.L > 0 && g.H > 0;
    const has5Rungs = Array.isArray(spec.reductionLadder) && spec.reductionLadder.length === 5;
    const crInkPaper = global.STUDIO_WADA_ENGINE.wcagContrast(P.ink, P.paper);
    const pass = hasValidBounds && has5Rungs && crInkPaper >= 7.0;
    return {
      charId: spec.id,
      favicon16px: hasValidBounds && has5Rungs,
      oneColorSilhouette: hasValidBounds && g.fluke.length >= 4 && g.fin.length >= 4,
      knockoutInversion: crInkPaper >= 7.0,
      squintSilhouette: spec.aspectRatio >= 0.22 && spec.aspectRatio <= 0.65,
      allPassed: pass,

  }

  const FEELS = {
    spring:  { id: 'spring',  label: 'Physical spring', ease: spring, warp: function (t) { return t; }, note: 'Atlas numbers: anticipation 0.15–0.3 s · take-off stretch 1.25–1.3 · landing spring f 2.4 / damp 7.', brief: 'anticipation 0.15–0.3 s, take-off sy 1.25–1.3, landing spring f 2.4 / damp 7, sx = 1/√sy' },
    glaser:  { id: 'glaser',  label: 'CETI house ease', ease: glaser, warp: function (t) { return t; }, note: 'cubic-bezier(0.22, 1, 0.36, 1) from the CETI design system · no overshoot · stagger 80–120 ms.', brief: 'CETI house ease cubic-bezier(0.22,1,0.36,1), no overshoot, stagger 80–120 ms' },
    rest:    { id: 'rest',    label: 'CETI rest ease',  ease: rest,   warp: function (t) { return t; }, note: 'cubic-bezier(0.4, 0, 0.6, 1) — symmetric, unhurried. The design system’s toggle ease.', brief: 'CETI rest ease cubic-bezier(0.4,0,0.6,1), symmetric, no overshoot' },
    slow:    { id: 'slow',    label: 'Slow tide ½×',    ease: glaser, warp: function (t) { return t * 0.5; }, note: 'Half speed with the house ease. Slow down, filter noise — taken literally.', brief: 'half-speed timing with the CETI house ease; longer holds' },
    held:    { id: 'held',    label: 'Held 12 fps',     ease: glaser, warp: function (t) { return Math.floor(t * 12) / 12; }, note: 'Each drawing held two frames — 12 fps inside a 24/30 fps master. The handmade cadence.', brief: 'each drawing held 2 frames (12 fps in a 24/30 fps master), seeded boil per held frame' },
    beat:    { id: 'beat',    label: 'Beat-locked 120', ease: glaser, warp: function (t) { const b = Math.floor(t / 0.5), f = (t - b * 0.5) / 0.18; return (b + glaser(Math.min(1, f))) * 0.5; }, note: 'Time moves in 0.18 s bursts that land on a 0.5 s grid (120 BPM), then holds.', brief: '120 BPM; every change lands on the 0.5 s grid in 0.18 s bursts, holds between' },
    saul:    { id: 'saul',    label: 'Saul snap-hold',  ease: bez(0.85, 0, 0.15, 1), warp: function (t) { const b = Math.floor(t * 8) / 8; return b; }, note: 'Saul Bass severe 8 fps poster snap with high-tension ease-in-out and graphic holds.', brief: 'Saul Bass 8 fps graphic snap with cubic-bezier(0.85,0,0.15,1) and poster holds' },

  // Tell-Apart Geometric Discriminability Kernel across CharacterSpecs (A1 / A4)
  function computeContourSignature(charSpec) {
    const g = actorGeom(charSpec, { len: 120, ph: 0, amp: 0 });
    const sig = [];
    for (let k = 0; k < 10; k++) {
      const idx = Math.floor((k / 10) * (g.body.length - 1));

  function auditArchetypeDiscriminability(customCharactersMap) {
    const map = customCharactersMap || global.STUDIO_CHARACTER_FOUNDRY.CHARACTERS;
    const ids = Object.keys(map);

    ids.forEach(function (id) { sigs[id] = computeContourSignature(map[id]); });
    let minDistance = Infinity;
    let closestPair = null;

  }

    render: render,
    draw: drawDirect,
    len: function (key) { return PROOFS[key] ? PROOFS[key].L : 4; },
    has: function (key) { return !!PROOFS[key]; },
    glaser: glaser,
    rest: rest,
    spring: spring,
    clamp: clamp,
    keys: Object.keys(PROOFS),
    PROOFS: PROOFS,
    FEELS: FEELS,
    FEEL_ORDER: FEEL_ORDER,
    actorGeom: actorGeom,
    computeContourSignature: computeContourSignature,
    auditArchetypeDiscriminability: auditArchetypeDiscriminability,
    computeOnionSkinFrames: computeOnionSkinFrames,

    registerCustomCharacter: function (spec) {
      if (!spec || !spec.id) return;
      O.customCharSpecs[spec.id] = spec;
      global.STUDIO_CHARACTER_FOUNDRY.CHARACTERS[spec.id] = spec;

      }
    }
  };

  function countSyllables(word) {
    let w = String(word || '').toLowerCase().replace(/[^a-z]/g, '');
    if (!w) return 0;
    if (w.length > 2 && /e$/.test(w) && !/le$/.test(w)) w = w.slice(0, -1);
    const m = w.match(/[aeiouy]+/g);
    return Math.max(1, m ? m.length : 0);
  }

  // Flesch-Kincaid grade with a vowel-group syllable heuristic (G33 · P8)
  function readingGrade(text) {
    const str = String(text || '').trim();
    const words = str.split(/\s+/).filter(function (w) { return /[A-Za-z0-9]/.test(w); });
    if (!words.length) return 0;
    const sentences = Math.max(1, (str.match(/[.!?]+(\s|$)/g) || []).length);
    const syl = words.reduce(function (n, w) { return n + Math.max(1, countSyllables(w)); }, 0);
    return Number((0.39 * words.length / sentences + 11.8 * syl / words.length - 15.59).toFixed(2));
  }

  // Fill the v9 fields on any sheet without overwriting what is already there (old boards keep loading).
  function applyStoryboardGrammarDefaults(sheet) {
    if (!sheet || !Array.isArray(sheet.beats)) return sheet;
    const n = sheet.beats.length;
    let lastClaimId = null;
    sheet.beats.forEach(function (b, i) {
      if (GRAMMAR_ROLES.indexOf(b.grammar) < 0) {
        b.grammar = LEGACY_ROLE_GRAMMAR[b.role] || (i === 0 ? 'hook' : (i === n - 1 ? 'landing' : (b.cameraMove === 'breather-hold' ? 'breather' : 'proof')));
      }
      if (b.grammar === 'claim') lastClaimId = b.id;
      if (b.grammar === 'proof' && b.claimId == null) b.claimId = lastClaimId;
      if (typeof b.say !== 'string' || !b.say.trim()) b.say = String(b.label || '').trim();
      if (typeof b.show !== 'string' || !b.show.trim()) b.show = String(b.visualAction || '').trim();
      if (!b.hear || typeof b.hear !== 'object') b.hear = { music: GRAMMAR_SECTION[b.grammar] || 'build', sfx: [] };
      if (!Array.isArray(b.hear.sfx)) b.hear.sfx = [];
      if (HEAR_SECTIONS.indexOf(b.hear.music) < 0) b.hear.music = GRAMMAR_SECTION[b.grammar] || 'build';
      if (typeof b.because !== 'string' || !b.because.trim()) b.because = b.hinge === 'BUT' ? 'But something changes here.' : 'So the story moves on.';
      if (b.plant === undefined) b.plant = null;
      if (b.returns === undefined) b.returns = null;
      if (typeof b.readingLevel !== 'number') b.readingLevel = Math.round(readingGrade(b.say + ' ' + b.show));
    });
    return sheet;
  }

  function buildV9Board(boardKey, o) {
    const sheet = JSON.parse(JSON.stringify(V9_STORYBOARDS[boardKey]));
    const n = sheet.beats.length;
    const total = Number(sheet.totalDurationSec) || n * 2;
    sheet.storyKey = sheet.proofKey || 's_voice';
    sheet.styleKey = o.styleKey || 'watercolor';
    sheet.charId = o.charId || 'ceti-whale';
    sheet.feelKey = o.feelKey || 'spring';
    sheet.palId = o.palId || 343;
    sheet.totalDurationSec = total;
    sheet.beats.forEach(function (b, i) {
      const t0 = Number(((i / n) * total).toFixed(2));
      const t1 = Number((((i + 1) / n) * total).toFixed(2));
      b.index = i;
      if (b.tStartSec == null) b.tStartSec = t0;
      if (b.tEndSec == null) b.tEndSec = t1;
      if (b.tMidSec == null) b.tMidSec = Number(((t0 + t1) / 2).toFixed(2));
      if (b.captionOnScreen == null) b.captionOnScreen = b.grammar === 'breather' ? '' : b.say;
      if (!b.wadaFocusRole) b.wadaFocusRole = b.role === 'climax' ? 'accentFocal' : (i % 2 === 0 ? 'secondaryStructure' : 'supportWash');
      if (!b.characterPose) {
        const k = n > 1 ? i / (n - 1) : 0;
        b.characterPose = {
          x: Number((0.18 + 0.64 * k).toFixed(2)), y: Number((0.52 - 0.14 * Math.sin(Math.PI * k)).toFixed(2)),
          rot: Number((0.12 * Math.cos(Math.PI * i / 4)).toFixed(2)), scale: i === n - 1 ? 1.0 : Number((0.92 + 0.16 * Math.sin(Math.PI * k)).toFixed(2)),
          fin: Number((0.45 * Math.sin(i * 1.1)).toFixed(2)), fluke: Number((0.50 * Math.cos(i * 0.9)).toFixed(2)),
          streak: i >= 3 ? 0.9 : 0.25, rung: i === n - 1 ? 2 : 1
        };
      }
    });
    applyStoryboardGrammarDefaults(sheet);
    return auditStoryboardSheet(sheet);
  }

  const WORDING_BANNED = ['boil', 'overshoot', 'misregistration', 'anticipation', 'follow-through', 'onion-skin', 'iris', 'negative-space', 'figure-ground',

  function wordCount(str) { return String(str || '').trim().split(/\s+/).filter(Boolean).length; }

    let sayN = 0, sayOk = 0, blurbN = 0, blurbOk = 0, proofN = 0, proofOk = 0, maxGrade = 0, plantOk = true, breathers = [];
    const copy = [];
    boards.forEach(function (sh) {
      const beats = sh.beats || [];
      const tag = sh.id || sh.title || 'sheet';
      beats.forEach(function (b, i) {
        const at = tag + '#' + (i + 1);

        if (b.grammar === 'proof') {

          const ci = beats.findIndex(function (c) { return c.id === b.claimId; });
          if (ci >= 0 && ci < i && beats[ci].grammar === 'claim') proofOk++; else fails.P4.push(at);
        }
        const g = readingGrade(String(b.say || '') + ' ' + String(b.show || ''));
        if (g > maxGrade) maxGrade = g;
        if (g > 8) fails.P8.push(at + ' grade ' + g);
      });
      const br = [];
      beats.forEach(function (b, i) { if (b.grammar === 'breather') br.push(i); });
      breathers.push(br.length);
      if (br.length !== 1 || br[0] === 0 || br[0] === 1 || br[0] === beats.length - 1) fails.P5.push(tag + ' breathers=' + br.join(','));
      const plant = beats[0] && beats[0].plant;
      if (plant && !beats.some(function (b) { return (b.grammar === 'callback' || b.grammar === 'landing') && b.returns === plant; })) { plantOk = false; fails.P6.push(tag); }
    });
    lib.forEach(function (it) {
      blurbN++; if (wordCount(it.plainEnglish) <= 14) blurbOk++; else fails.P2.push(it.token);
      copy.push([it.token + '.title', it.title], [it.token + '.plainEnglish', it.plainEnglish]);
    });
    sch.forEach(function (sc) {
      blurbN++; if (wordCount(sc.notes) <= 14) blurbOk++; else fails.P2.push(sc.token || sc.tag);
      copy.push([(sc.token || sc.tag) + '.title', sc.title], [(sc.token || sc.tag) + '.notes', sc.notes]);
    });
    copy.forEach(function (c) {
      const bad = bareJargon(c[1]);
      if (bad.length) fails.P3.push(c[0] + ':' + bad.join('/'));
      if (WORDING_INTERNAL_RX.test(String(c[1] || ''))) fails.P7.push(c[0]);
    });
    const valid = Object.keys(fails).every(function (k) { return fails[k].length === 0; });
    return {
      valid: valid, fails: fails, maxGrade: maxGrade,
      detail: 'say≤12 ' + sayOk + '/' + sayN + ' · blurb≤14 ' + blurbOk + '/' + blurbN + ' · jargon ' + fails.P3.length + ' · proofs ' + proofOk + '/' + proofN +
        ' · breather ' + breathers.join('/') + ' · plant→return ' + (plantOk ? 'y' : 'n') + ' · internal ' + fails.P7.length + ' · grade ' + maxGrade
    };
  }

  // `hear` drives the score: MUSIC.plan/scoreForBeat read `role` + `sfx`, so derive them from hear.music / hear.sfx.
  // Legacy beats keep their role unless it contradicts the section; empty hear.sfx keeps the engine's default cues.
  const SECTION_MUSIC_ROLE = { intro: 'hook', rest: 'breather', outro: 'callback' };
  function storyboardToMusicSheet(sheet, feelKey) {
    const sb = sheet || {};
    const beats = (sb.beats || []).map(function (b) {
      const out = Object.assign({}, b);
      const sec = b.hear && b.hear.music;
      if (SECTION_MUSIC_ROLE[sec]) out.role = SECTION_MUSIC_ROLE[sec];
      else if (out.role === 'breather' || out.role === 'hook' || out.role === 'callback') {
        out.role = sec === 'peak' ? 'turn' : (sec === 'return' ? 'climax' : 'escalation');
      }
      if (b.hear && Array.isArray(b.hear.sfx) && b.hear.sfx.length) {
        const t0 = Number(b.tStartSec) || 0;
        out.sfx = b.hear.sfx.map(function (x) { return { t: Number((t0 + (Number(x.at) || 0)).toFixed(3)), name: String(x.name).toUpperCase(), gain: x.gain }; });
      }
      return out;
    });
    return Object.assign({}, sb, { feelKey: feelKey || sb.feelKey, beats: beats });
  }

  // G32 · Storyboard grammar audit (pure; storyboard-grammar.md rules 1–7)
  function auditStoryboardGrammar(sheet) {
    const beats = (sheet && sheet.beats) || [];
    const n = beats.length;
    const errors = [];
    const count = function (g) { return beats.filter(function (b) { return b.grammar === g; }).length; };
    const idxOf = function (g) { for (let i = 0; i < n; i++) if (beats[i].grammar === g) return i; return -1; };
    if (n < 6 || n > 8) errors.push('needs 6–8 beats (has ' + n + ')');
    beats.forEach(function (b, i) {
      if (GRAMMAR_ROLES.indexOf(b.grammar) < 0) errors.push('beat ' + (i + 1) + ': unknown grammar "' + b.grammar + '"');
      if (typeof b.say !== 'string' || !b.say.trim()) errors.push('beat ' + (i + 1) + ': missing say');
      if (typeof b.show !== 'string' || !b.show.trim()) errors.push('beat ' + (i + 1) + ': missing show');
      if (!b.hear || HEAR_SECTIONS.indexOf(b.hear.music) < 0) errors.push('beat ' + (i + 1) + ': hear.music not a section');
      else if (!Array.isArray(b.hear.sfx) || !b.hear.sfx.every(function (x) { return x && SFX_CUE_NAMES.indexOf(String(x.name).toUpperCase()) >= 0; })) errors.push('beat ' + (i + 1) + ': hear.sfx uses an unknown cue');
      const bec = String(b.because || '').trim();
      if (b.hinge === 'BUT' ? !/^But\b/.test(bec) : (b.hinge === 'THEREFORE' ? !/^So\b/.test(bec) : true)) errors.push('beat ' + (i + 1) + ': because must start with ' + (b.hinge === 'BUT' ? '"But"' : '"So"'));
    });
    if (count('hook') !== 1 || idxOf('hook') !== 0) errors.push('exactly one hook, first');
    if (count('landing') !== 1 || idxOf('landing') !== n - 1) errors.push('exactly one landing, last');
    const claims = beats.filter(function (b) { return b.grammar === 'claim'; });
    if (claims.length < 1 || claims.length > 2) errors.push('1–2 claims (has ' + claims.length + ')');
    beats.forEach(function (b, i) {
      if (b.grammar !== 'proof') return;
      const ci = beats.findIndex(function (c) { return c.id === b.claimId; });
      if (ci < 0 || ci >= i || beats[ci].grammar !== 'claim') errors.push('beat ' + (i + 1) + ': proof does not cite an earlier claim');
    });
    claims.forEach(function (c) {
      const k = beats.filter(function (b) { return b.grammar === 'proof' && b.claimId === c.id; }).length;
      if (k < 1 || k > 3) errors.push('claim ' + c.id + ' has ' + k + ' proofs (needs 1–3)');
    });
    const bi = idxOf('breather');
    if (count('breather') !== 1) errors.push('exactly one breather (has ' + count('breather') + ')');
    else {
      if (bi === 0 || bi === 1 || bi === n - 1) errors.push('breather not first, last, or right after the hook');
      if (beats[bi].activeSimultaneousMoves !== 1 || beats[bi].cameraMove !== 'breather-hold') errors.push('breather must hold still (1 move, breather-hold)');
    }
    const cb = count('callback');
    const landing = beats[n - 1] || {};
    if (cb > 1) errors.push('at most one callback');
    if (cb === 0 && !(landing.grammar === 'landing' && landing.returns)) errors.push('no callback (and the landing carries no returns)');
    const plant = beats[0] && beats[0].plant;
    const returners = beats.filter(function (b) { return (b.grammar === 'callback' || b.grammar === 'landing') && b.returns; });
    if (plant && !returners.some(function (b) { return b.returns === plant; })) errors.push('plant "' + plant + '" never returns');
    if (returners.some(function (b) { return b.returns !== plant; })) errors.push('returns does not match the hook plant');
    if (!/echo|calm|first|hold|frame 0/i.test(String(landing.show || ''))) errors.push('landing show must echo the hook frame');
    return { valid: errors.length === 0, errors: errors, beats: n, claims: claims.length, breatherIdx: bi, plant: plant || null };
  }

  function buildStoryboardSheet(opts) {
    const o = opts || {};
    const storyKey = o.storyKey || 's_voice';
    const styleKey = o.styleKey || 'watercolor';
    const charId = o.charId || 'ceti-whale';
    const feelKey = o.feelKey || 'spring';
    const palId = o.palId || 343;
    const charSpec = FOUNDRY.CHARACTERS[charId] || FOUNDRY.CHARACTERS['ceti-whale'];
    const story = TAX.STMETA[storyKey] || TAX.STORIES[0];
    const totalSec = (global.MA && global.MA.len(storyKey)) || 10;
    if (o.boardKey && V9_STORYBOARDS[o.boardKey]) {
      return buildV9Board(o.boardKey, { styleKey: styleKey, charId: charId, feelKey: feelKey, palId: palId });
    }

    // Expand story beats into a canonical 8-beat S4/S5 storyboard sheet with causal hinges & distinct titles
    const rawBeats = story.beats || [];
    const roles = ['hook', 'threshold', 'escalation', 'turn', 'filter', 'breather', 'climax', 'callback'];
    const roleFallbacks = ['Opening Hook', 'Threshold Crossing', 'Rising Escalation', 'Causal Turn', 'Harmonic Filter', 'Breather Hold', 'Peak Climax', 'Calm Callback'];
    const hinges = ['THEREFORE', 'BUT', 'THEREFORE', 'BUT', 'THEREFORE', 'THEREFORE', 'BUT', 'THEREFORE'];
    const cams = ['static-wide', 'pan-follow', 'push-in', 'dutch-tilt', 'tracking-drift', 'breather-hold', 'kick-shake', 'pull-back'];

    const usedLabels = {};
    const beats = [];
    for (let i = 0; i < 8; i++) {
      const t0 = Number(((i / 8) * totalSec).toFixed(2));
      const t1 = Number((((i + 1) / 8) * totalSec).toFixed(2));
      const srcBeat = rawBeats.length >= 8
        ? rawBeats[i]
        : (rawBeats[Math.min(rawBeats.length - 1, Math.floor((i / 8) * rawBeats.length))] || [t0, roleFallbacks[i], 'Visual state change on stage.']);
      const isBreather = (i === 5);
      const isCallback = (i === 7);
      let label = srcBeat && srcBeat[1] ? String(srcBeat[1]).trim() : roleFallbacks[i];
      if (usedLabels[label.toLowerCase()]) {
        label = roleFallbacks[i] + ' · ' + label;
      }
      usedLabels[label.toLowerCase()] = true;

      const rawAction = (srcBeat && srcBeat[2]) ? String(srcBeat[2]) : 'Visual state change on stage.';
      const action = isCallback
        ? ('Final frame echoes Beat 1 (' + (rawBeats[0] ? rawBeats[0][1] : 'opening pose') + '): ' + rawAction.replace(/\bwhale\b/gi, charSpec.name.toLowerCase()) + ' [Wada No. ' + palId + ']')
        : (isBreather
          ? (charSpec.name + ' holds in low-density negative space (' + rawAction.replace(/\bwhale\b/gi, charSpec.name.toLowerCase()) + ') so the eye settles before the climax.')
          : rawAction.replace(/\bwhale\b/gi, charSpec.name.toLowerCase()));

      const sampleT = (rawBeats.length >= 8 && typeof srcBeat[0] === 'number')
        ? Number(Math.min(totalSec - 0.15, Math.max(0.1, srcBeat[0] + 0.35)).toFixed(2))
        : Number(((t0 + t1) / 2).toFixed(2));

      beats.push({
        index: i,
        id: 'beat-' + (i + 1),
        tStartSec: t0,
        tEndSec: t1,
        tMidSec: sampleT,
        role: roles[i],
        hinge: hinges[i],
        label: label,
        visualAction: action,
        captionOnScreen: i === 5 ? '' : (label.toUpperCase() + ' — ' + action.slice(0, 56)),
        cameraMove: cams[i],
        activeSimultaneousMoves: isBreather ? 1 : (i % 2 === 0 ? 1 : 2),
        wadaFocusRole: i === 6 ? 'accentFocal' : (i % 2 === 0 ? 'secondaryStructure' : 'supportWash'),
        characterPose: {
          x: Number((0.18 + 0.64 * (i / 7)).toFixed(2)),
          y: Number((0.52 - 0.14 * Math.sin(Math.PI * i / 7)).toFixed(2)),
          rot: Number((0.12 * Math.cos(Math.PI * i / 4)).toFixed(2)),
          scale: isCallback ? 1.0 : Number((0.92 + 0.16 * Math.sin(Math.PI * i / 7)).toFixed(2)),
          fin: Number((0.45 * Math.sin(i * 1.1)).toFixed(2)),
          fluke: Number((0.50 * Math.cos(i * 0.9)).toFixed(2)),
          streak: i >= 3 ? 0.9 : 0.25,
          rung: i === 7 ? 2 : 1
        }
      });
    }

    return auditStoryboardSheet(applyStoryboardGrammarDefaults({
      id: 'sb-' + storyKey + '-' + charId,
      title: story.title.replace(/\bwhale\b/gi, charSpec.name),
      storyKey: storyKey,
      styleKey: styleKey,
      charId: charId,
      feelKey: feelKey,
      palId: palId,
      totalDurationSec: totalSec,
      beats: beats
    }));
  }

  function resolveNonOverlappingPosition(existingNodes, targetX, targetY, w, h, padX, padY) {
    const nodes = existingNodes || [];
    const nw = w || 330;
    const nh = h || 470;
    const px = padX != null ? padX : 36;
    const py = padY != null ? padY : 40;
    let x = Math.max(24, Math.round(targetX));
    let y = Math.max(24, Math.round(targetY));

    function collides(cx, cy) {
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const ow = n.width || 330;
        const oh = n.height || 470;
        const overlapX = (cx < n.x + ow + px) && (cx + nw + px > n.x);
        const overlapY = (cy < n.y + oh + py) && (cy + nh + py > n.y);
        if (overlapX && overlapY) return true;
      }
      return false;
    }

    let attempts = 0;
    while (collides(x, y) && attempts < 60) {
      attempts++;
      if (attempts % 4 !== 0) {
        y += nh + py;
      } else {
        x += nw + px;
        y = Math.max(24, Math.round(targetY));
      }
    }
    return { x: x, y: y };
  }

  function autoLayoutDAG(dag) {
    if (!dag || !Array.isArray(dag.nodes)) return dag;
    const byId = {};
    dag.nodes.forEach(function (n) { byId[n.id] = n; });

    function getDepth(n) {
      let d = 0;
      let cur = n;
      const seen = {};
      while (cur && cur.parentId && byId[cur.parentId] && !seen[cur.parentId]) {
        seen[cur.parentId] = true;
        d++;
        cur = byId[cur.parentId];
      }
      return d;
    }

    const cols = {};
    dag.nodes.forEach(function (n) {
      const d = getDepth(n);
      if (!cols[d]) cols[d] = [];
      cols[d].push(n);
    });

    const colKeys = Object.keys(cols).map(Number).sort(function (a, b) { return a - b; });
    const placed = [];
    colKeys.forEach(function (colIdx) {
      const list = cols[colIdx];
      list.forEach(function (n, rowIdx) {
        const targetX = 40 + colIdx * 395;
        const targetY = 36 + rowIdx * 515;
        const pos = resolveNonOverlappingPosition(placed, targetX, targetY, n.width || 320, n.height || 460, 36, 40);
        n.x = pos.x;
        n.y = pos.y;
        n.height = n.height || 460;
        placed.push(n);
      });
    });

    return stampDAGRestrictionHashes(dag);
  }

  // Canonical FNV-1a 32-bit packet hash for Sheaf Restriction Glue (G10: ρ(child) == parent)
  function computePacketHash(payload) {
    const p = payload || {};
    const canonical = [
      p.styleKey || 'watercolor',
      p.storyKey || 's_voice',
      p.charId || 'ceti-whale',
      p.interaction || 'hero-journey',
      String(p.palId || 343),
      p.feelKey || 'spring'
    ].join('|');
    let h = 0x811c9dc5;
    for (let i = 0; i < canonical.length; i++) {
      h ^= canonical.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return 'ρ_' + (h >>> 0).toString(16).padStart(8, '0');
  }

  function computeGluingHash(hashA, hashB) {
    const raw = String(hashA || 'ρ_0') + '⊕' + String(hashB || 'ρ_0');
    let h = 0x811c9dc5;
    for (let i = 0; i < raw.length; i++) {
      h ^= raw.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return 'ρ_' + (h >>> 0).toString(16).padStart(8, '0');
  }

  function stampDAGRestrictionHashes(dag) {
    const byId = {};
    (dag.nodes || []).forEach(function (n) {
      n.packetHash = computePacketHash(n.payload);
      if (!n.conjectureNote) {
        n.conjectureNote = n.status === 'committed'
          ? '†C0 · Verified section along committed spine'
          : '†C1 · Candidate fork testing alternative register/actor';
      }
      byId[n.id] = n;
    });
    (dag.nodes || []).forEach(function (n) {
      if (n.parentId && n.secondaryParentId && byId[n.parentId] && byId[n.secondaryParentId]) {
        n.upstreamHash = computeGluingHash(byId[n.parentId].packetHash, byId[n.secondaryParentId].packetHash);
      } else if (n.parentId && byId[n.parentId]) {
        n.upstreamHash = byId[n.parentId].packetHash;
      } else {
        n.upstreamHash = 'ρ_root0000';
      }
    });
    return dag;
  }

  function verifyDAGSheafCohomology(dag) {
    if (!dag || !Array.isArray(dag.nodes) || !Array.isArray(dag.edges)) {
      return { valid: false, h0GlobalSections: 0, coboundaryDefects: ['Malformed DAG'], errors: ['Malformed DAG'] };
    }
    const byId = {};
    dag.nodes.forEach(function (n) { byId[n.id] = n; });
    const defects = [];
    dag.nodes.forEach(function (n) {
      const expectedSelf = computePacketHash(n.payload);
      if (n.packetHash && n.packetHash !== expectedSelf) {
        defects.push('Node ' + n.id + ' packetHash mismatch (' + n.packetHash + ' != ' + expectedSelf + ')');
      }
      if (n.parentId && n.secondaryParentId) {
        const p1 = byId[n.parentId];
        const p2 = byId[n.secondaryParentId];
        if (!p1 || !p2) {
          defects.push('Pushout node ' + n.id + ' references missing parent (' + n.parentId + ' ⊕ ' + n.secondaryParentId + ')');
        } else {
          const expectedGlue = computeGluingHash(p1.packetHash, p2.packetHash);

  // Build combined vocabulary list including dynamic user-saved #color/<tag> schemes
  function getFullVocabLibrary(savedSchemes) {
    const schemes = Array.isArray(savedSchemes) && savedSchemes.length ? savedSchemes : DEFAULT_SAVED_SCHEMES;
    const colorItems = schemes.map(function (sc) {
      const tok = sc.token || ('#color/' + sc.tag);
      const sl = sc.slash || ('/color/' + sc.tag);
      const nm = sc.title || sc.name || ('Wada No. ' + sc.palId);
      const desc = sc.notes || ('Saved color scheme pinned to Sanzo Wada No. ' + sc.palId + ' (' + (sc.tags || []).join(' ') + ').');
      return {
        id: sc.id || ('color-' + sc.tag),
        token: tok,
        slash: sl,
        slashToken: sl,
        category: 'color',
        title: nm,
        plainName: nm,
        plainEnglish: desc,
        plainDesc: desc,
        jargonTerm: 'Sanzo Wada No. ' + sc.palId + ' · Ground: ' + (sc.ground || 'atlas') + ' · ' + (sc.tags || []).join(' '),
        promptSnippet: tok + ' Pin palette to "' + nm + '" (Wada No. ' + sc.palId + ').',
        patch: { palId: sc.palId, ground: sc.ground || 'atlas', schemeTag: sc.tag, colorSchemeTag: tok }
      };
    });
    const normalizedBase = VOCAB_LIBRARY.map(function (it) {
      const p = Object.assign({}, it.patch || {});
      if (p.mStyle && !p.styleKey) p.styleKey = p.mStyle;
      if (p.styleKey && !p.mStyle) p.mStyle = p.styleKey;
      return Object.assign({}, it, {
        slash: it.slash || it.slashToken,
        slashToken: it.slashToken || it.slash,
        plainName: it.plainName || it.title,
        title: it.title || it.plainName,
        plainDesc: it.plainDesc || it.plainEnglish,
        plainEnglish: it.plainEnglish || it.plainDesc,
        patch: p
      });
    });
    return normalizedBase.concat(colorItems);
  }

  function searchVocabLibrary(query, category, savedSchemes) {
    const all = getFullVocabLibrary(savedSchemes);
    const cat = (category && category !== 'all') ? category.toLowerCase() : null;
    const rawQ = String(query || '').trim().toLowerCase();
    const cleanQ = rawQ.replace(/^[/#]+/, '');

    return all.filter(function (item) {
      if (cat && item.category !== cat) return false;
      if (!cleanQ) return true;
      const hay = (
        item.token + ' ' +
        item.slashToken + ' ' +
        item.category + ' ' +
        item.title + ' ' +
        item.plainEnglish + ' ' +
        item.jargonTerm
      ).toLowerCase();
      return hay.includes(cleanQ);
    });
  }

  // Parse any #token or /token inside a prompt/note and return the combined patch + matched items
  function parsePromptTokens(text, savedSchemes) {
    const all = getFullVocabLibrary(savedSchemes);
    const str = String(text || '');
    const matched = [];
    const combinedPatch = {};
    let explicitThemeStyle = null;

    all.forEach(function (item) {
      const tokLower = item.token.toLowerCase();
      const slashLower = item.slashToken.toLowerCase();
      const slugLower = tokLower.split('/')[1] || '';
      const lowerStr = str.toLowerCase();
      if (
        lowerStr.includes(tokLower) ||

  // 4. MULTI-PROVIDER OAUTH 2.0 PKCE + LOCAL BRIDGE + SYNTHESIZER (G10 · G11)
  // ─────────────────────────────────────────────────────────────────────────
  function base64UrlEncode(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    const b64 = typeof btoa === 'function' ? btoa(bin) : Buffer.from(bin, 'binary').toString('base64');
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function generateCodeVerifier() {
    const arr = new Uint8Array(32);
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
      crypto.getRandomValues(arr);
    } else {
      for (let i = 0; i < 32; i++) arr[i] = (Math.random() * 256) | 0;
    }
    return base64UrlEncode(arr);
  }

  async function generateCodeChallengeS256(verifier) {
    if (typeof crypto !== 'undefined' && crypto.subtle && crypto.subtle.digest) {
      const data = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return base64UrlEncode(new Uint8Array(digest));
    }
    // Deterministic fallback hash for non-WebCrypto CLI test environments
    let h1 = 0xdeadbeef ^ verifier.length, h2 = 0x41c6ce57 ^ verifier.length;
    for (let i = 0; i < verifier.length; i++) {
      const ch = verifier.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    const bytes = new Uint8Array(32);
    for (let i = 0; i < 32; i++) bytes[i] = ((h1 >>> (i % 24)) ^ (h2 >>> ((i * 3) % 24)) ^ (i * 17)) & 255;
    return base64UrlEncode(bytes);
  }

    if (!resp.summary || typeof resp.summary !== 'string') errors.push('Missing summary');

      if (!(n >= 1 && n <= 348)) errors.push('suggestedWadaComboNo out of range 1..348');

    const state = 'st_' + Date.now().toString(36);
    const sessionRecord = {

      codeChallengeMethod: 'S256',

    try {

    const cbUrl = redirectUri || (typeof location !== 'undefined' ? location.origin + location.pathname : 'http://127.0.0.1:43110/oauth/callback');
    let authUrl = '';
    if (provider === 'openrouter-pkce') {

    const verifier = (saved && saved.codeVerifier) || generateCodeVerifier();

  const DB_NAME = 'ceti_motion_atlas_studio_v1';

  function saveSessionState(sessionObj) {
    const payload = Object.assign({ schemaVersion: '1.0.0', updatedAt: new Date().toISOString() }, sessionObj);
    try {
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem(DB_NAME, JSON.stringify(payload));
      }
      if (typeof indexedDB !== 'undefined') {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function (e) {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        };
        req.onsuccess = function (e) {
          const db = e.target.result;
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(Object.assign({ id: 'active-session' }, payload));
        };
      }
    } catch (_e) { /* ignore storage restrictions */ }
    return payload;
  }

    return null;

          const rawDy = e.clientY - self._dragStart[1];
          self._dragMovedPx = Math.hypot(rawDx, rawDy);
          const node = self.state.dag.nodes.find(function (n) { return n.id === self._draggingNodeId; });

            const dx = rawDx / self.state.zoom;
            const dy = rawDy / self.state.zoom;

            node.y = Math.max(8, Math.round(self._panStart[1] + dy));

        if (self._draggingNodeId) {
          const draggedId = self._draggingNodeId;
          const movedPx = self._dragMovedPx || 0;
          const el = self.root.querySelector('[data-dag-node="' + draggedId + '"]');
          if (el) el.classList.remove('dag-node-dragging');
          self._draggingNodeId = null;
          self._dragMovedPx = 0;

          if (movedPx < 5) {
            // Simple click on card: set as Source A (or Shift+Click for Source B!)
            if (e && e.shiftKey) {
              self.setState({ compareNodeId: draggedId, showABCompare: true });
            } else if (self.state.selectedNodeId !== draggedId) {
              self.setState({ selectedNodeId: draggedId });
            }
          } else {
            // Completed a freeform drag: persist exact (x, y) without re-rendering DOM!
            const node = self.state.dag.nodes.find(function (n) { return n.id === draggedId; });
            if (node && CO.moveCanvasNode) {
              CO.moveCanvasNode(self.state.dag, draggedId, node.x, node.y);
            }
            CO.saveSessionState(self.state);
          }
        }
        if (self._draggingCanvas) {
          self._draggingCanvas = false;
          CO.saveSessionState(self.state);
        }
      });
    }

    updateDagEdgesSVG() {
      const svg = this.root.querySelector('#dag-edges-svg');
      if (!svg) return;
      svg.innerHTML = this.renderDagEdgesMarkup();
    }

    renderDagEdgesMarkup() {
      const nodesById = {};
      (this.state.dag.nodes || []).forEach(function (n) { nodesById[n.id] = n; });
      return (this.state.dag.edges || []).map(function (e) {
        const a = nodesById[e.fromNodeId], b = nodesById[e.toNodeId];
        if (!a || !b) return '';
        const x1 = a.x + (a.width || 315), y1 = a.y + 185;
        const x2 = b.x, y2 = b.y + 185;
        const cx1 = x1 + Math.max(55, (x2 - x1) * 0.46), cx2 = x2 - Math.max(55, (x2 - x1) * 0.46);
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 8;
        const stroke = e.kind === 'synthesis' ? '#2E5A44' : (e.kind === 'fork' ? '#8C4A2E' : (e.kind === 'comparison' ? '#1E3F66' : '#1A1F2E'));

          '<circle cx="' + x2 + '" cy="' + y2 + '" r="4" fill="' + stroke + '"/>' +
          '<rect x="' + (mx - 58) + '" y="' + (my - 10) + '" width="116" height="17" rx="4" fill="#FBF3E6" stroke="' + stroke + '" stroke-opacity="0.35"/>' +
          '<text x="' + mx + '" y="' + (my + 2) + '" text-anchor="middle" font-family="Space Mono, monospace" font-size="8.5" font-weight="700" fill="' + stroke + '">' + esc(e.label) + '</text>' +
          '</g>';
      }).join('');
    }
  }

  global.MotionAtlasStudioApp = MotionAtlasStudioApp;
