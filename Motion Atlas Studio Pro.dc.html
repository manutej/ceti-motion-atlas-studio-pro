<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CETI Motion Atlas Studio Pro — Transcendental Motion Graphic &amp; Narrative Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --paper: #FBF3E6;
    --paper2: #F2E4CE;
    --ink: #1A1F2E;
    --ink-soft: rgba(26, 31, 46, 0.72);
    --ink-faint: rgba(26, 31, 46, 0.16);
    --rust: #8C4A2E;
    --sage: #2E5A44;
    --ochre: #C88A2E;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.48;
    -webkit-font-smoothing: antialiased;
  }

  /* Studio Shell & Compact Sticky Masthead (<= 136px height) */
  .st-shell, .studio-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 12% 8%, rgba(200, 138, 46, 0.06), transparent 45%),
      radial-gradient(circle at 88% 18%, rgba(46, 111, 126, 0.05), transparent 45%),
      var(--paper);
    color: var(--ink);
    transition: background-color 220ms ease;
  }

  .st-header, .studio-topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(251, 243, 230, 0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1.5px solid var(--ink);
    box-shadow: 0 2px 10px rgba(26, 31, 46, 0.06);
  }

  .st-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 5px 18px 4px;
    border-bottom: 1px solid rgba(26, 31, 46, 0.1);
  }

  .st-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    min-width: 0;
  }

  .st-title, .studio-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: 16.5px;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--ink);
    line-height: 1.15;
  }

  .st-sub {
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.25;
  }

  .st-top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  /* Compact Single-Row Global Pinning Strip */
  .st-control-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 4px 18px;
    background: rgba(242, 228, 206, 0.45);
    border-bottom: 1px solid rgba(26, 31, 46, 0.1);
    flex-wrap: nowrap;
    overflow-x: auto;
  }

  .st-ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .st-ctrl-group .st-label {
    margin-bottom: 0;
    font-size: 8.5px;
    white-space: nowrap;
  }

  .st-rung-bar {
    display: inline-flex;
    gap: 2px;
    background: rgba(26, 31, 46, 0.05);
    padding: 2px;
    border-radius: 5px;
  }

  /* Compact Wada Quick-Pin Strip */
  .st-wada-strip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 18px;
    background: rgba(251, 243, 230, 0.85);
    border-bottom: 1px solid rgba(26, 31, 46, 0.1);
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }

  .st-wada-strip::-webkit-scrollbar {
    display: none;
  }

  .st-pill {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid rgba(26, 31, 46, 0.22);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: all 120ms ease;
  }

  .st-pill:hover {
    border-color: var(--ink);
    background: var(--paper2);
  }

  .st-pill-active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    font-weight: 700;
  }

  /* 7 Studio Surfaces Navigation Bar */
  .st-tabs, .studio-nav {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 18px;
    background: var(--paper2);
    overflow-x: auto;
    white-space: nowrap;
  }

  .st-tab, .studio-tab {
    appearance: none;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    background: rgba(251, 243, 230, 0.72);
    color: var(--ink);
    border: 1px solid rgba(26, 31, 46, 0.2);
    border-radius: 5px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 120ms ease;
    white-space: nowrap;
  }

  .st-tab:hover, .studio-tab:hover {
    border-color: var(--ink);
    background: var(--paper);
  }

  .st-tab.active, .studio-tab.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    box-shadow: 0 2px 6px rgba(26, 31, 46, 0.16);
  }

  /* Main Container & Surfaces */
  .st-main, .studio-main {
    flex: 1;
    padding: 12px 18px 28px;
    max-width: 1720px;
    width: 100%;
    margin: 0 auto;
  }

  .st-surface {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .st-panel {
    background: rgba(251, 243, 230, 0.92);
    border: 1px solid rgba(26, 31, 46, 0.22);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 3px 12px rgba(26, 31, 46, 0.04);
  }

  .st-eyebrow {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--rust);
    font-weight: 700;
  }

  .st-section-h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 20px;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 4px 0;
  }

  .st-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    font-weight: 700;
    margin-bottom: 3px;
  }

  .st-mono-xs {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.03em;
  }

  /* Controls & Buttons */
  .st-select, .st-input {
    font-family: var(--font-body);
    font-size: 11.5px;
    padding: 3px 7px;
    border-radius: 5px;
    border: 1px solid rgba(26, 31, 46, 0.28);
    background: var(--paper);
    color: var(--ink);
  }

  .st-btn {
    appearance: none;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 5px;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: all 120ms ease;
    white-space: nowrap;
  }

  .st-btn:hover {
    background: var(--paper2);
  }

  .st-btn-ink {
    background: var(--ink);
    color: var(--paper);
  }

  .st-btn-ink:hover {
    background: #2b3248;
  }

  .st-btn-rust {
    background: var(--rust);
    color: var(--paper);
    border-color: var(--rust);
  }

  .st-btn-rust:hover {
    background: #733920;
  }

  .st-mini-btn {
    appearance: none;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 4px;
    border: 1px solid rgba(26, 31, 46, 0.26);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }

  .st-mini-btn.on, .st-mini-btn:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .st-badge {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid currentColor;
    white-space: nowrap;
  }

  .badge-pass {
    color: var(--sage);
    background: rgba(46, 90, 68, 0.1);
  }

  .badge-warn {
    color: var(--rust);
    background: rgba(140, 74, 46, 0.12);
  }

  /* Grids & Cards across Surfaces II, III, IV, V, VI */
  .fork-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .fork-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .st-card-inner {
    background: var(--paper);
    border: 1px solid rgba(26, 31, 46, 0.16);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .fork-card {
    background: rgba(251, 243, 230, 0.96);
    border: 1.5px solid rgba(26, 31, 46, 0.22);
    border-radius: 9px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 140ms ease;
    display: flex;
    flex-direction: column;
  }

  .fork-card:hover {
    border-color: var(--ink);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(26, 31, 46, 0.08);
  }

  .fork-card-active {
    border: 2px solid var(--rust);
    background: rgba(242, 228, 206, 0.65);
    box-shadow: 0 4px 14px rgba(140, 74, 46, 0.14);
  }

  .fork-card-title {
    margin: 5px 0 3px;
    font-family: var(--font-display);
    font-size: 16.5px;
    font-weight: 500;
  }

  .fork-card-body {
    margin: 0;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .char-grid-5, .rung-grid-5 {
    display: grid;
    grid-template-columns: repeat(5, minmax(170px, 1fr));
    gap: 10px;
    overflow-x: auto;
  }

  .char-grid-4 {
    display: grid;
    grid-template-columns: repeat(4, minmax(220px, 1fr));
    gap: 12px;
  }

  .char-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(260px, 1fr));
    gap: 12px;
  }

  .char-card, .sb-card {
    background: rgba(251, 243, 230, 0.96);
    border: 1px solid rgba(26, 31, 46, 0.22);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 140ms ease;
    display: flex;
    flex-direction: column;
  }

  .char-card:hover, .sb-card:hover {
    border-color: var(--ink);
    box-shadow: 0 4px 12px rgba(26, 31, 46, 0.08);
  }

  .char-card-active {
    border: 2px solid var(--rust);
    background: rgba(242, 228, 206, 0.68);
    box-shadow: 0 4px 14px rgba(140, 74, 46, 0.15);
  }

  /* Infinite-Zoom Living Canvas Pasteboard (Surface 1) */
  .canvas-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--paper2);
    border: 1px solid rgba(26, 31, 46, 0.22);
    border-radius: 8px;
    padding: 6px 12px;
  }

  .living-canvas-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 12px;
    min-height: 670px;
  }

  .living-canvas-viewport {
    position: relative;
    overflow: hidden;
    background-color: var(--paper);
    background-image:
      radial-gradient(rgba(26, 31, 46, 0.18) 1px, transparent 1px),
      linear-gradient(to right, rgba(26, 31, 46, 0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(26, 31, 46, 0.04) 1px, transparent 1px);
    background-size: 24px 24px, 120px 120px, 120px 120px;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    cursor: grab;
    user-select: none;
    min-height: 670px;
  }

  .living-canvas-viewport:active {
    cursor: grabbing;
  }

  .dag-transform-stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 3600px;
    height: 2400px;
    transform-origin: 0 0;
  }

  .dag-edges-svg {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    overflow: visible;
  }

  .dag-node {
    position: absolute;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 9px 11px;
    box-shadow: 0 6px 18px rgba(26, 31, 46, 0.12);
    cursor: grab;
    transition: box-shadow 120ms ease, border-color 120ms ease;
  }

  .dag-node-selected {
    border: 2.5px solid var(--rust);
    box-shadow: 0 0 0 4px rgba(140, 74, 46, 0.18), 0 10px 24px rgba(26, 31, 46, 0.18);
    z-index: 10;
  }

  .dag-node-header, .dag-node-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 9px;
    padding-bottom: 4px;
    margin-bottom: 4px;
    border-bottom: 1px dashed rgba(26, 31, 46, 0.18);
  }

  .dag-node-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.2;
    margin: 2px 0;
  }

  .dag-node-sub {
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-bottom: 5px;
    line-height: 1.25;
  }

  .dag-canvas-wrap {
    margin: 4px 0;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(26, 31, 46, 0.18);
  }

  .dag-node-notes {
    margin: 4px 0 0;
    font-size: 10.5px;
    line-height: 1.32;
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .dag-node-footer, .dag-node-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px solid rgba(26, 31, 46, 0.1);
  }

  .canvas-minimap {
    position: absolute;
    bottom: 10px;
    right: 12px;
    background: rgba(251, 243, 230, 0.94);
    border: 1px solid var(--ink);
    border-radius: 6px;
    padding: 5px 10px;
    pointer-events: none;
    z-index: 20;
  }

  .dag-inspector {
    background: rgba(251, 243, 230, 0.96);
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
  }

  .ab-compare-drawer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    background: var(--paper2);
    border: 1.5px solid var(--rust);
    border-radius: 10px;
    padding: 10px 14px;
  }

  /* Code Box & Modals */
  .st-code-box {
    background: #141824;
    color: #FBF3E6;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    padding: 14px;
    border-radius: 8px;
    max-height: 480px;
    overflow: auto;
    white-space: pre-wrap;
    margin: 0;
  }

  .st-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(20, 24, 36, 0.55);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .st-modal {
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 18px 22px;
    max-width: 820px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.32);
  }

  @media (max-width: 1200px) {
    .char-grid-4 { grid-template-columns: repeat(2, 1fr); }
    .char-grid-5 { grid-template-columns: repeat(3, 1fr); }
    .living-canvas-layout, .fork-grid-2, .fork-grid-3 {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div id="motion-atlas-studio-root"></div>

  <!-- 1. Sanzo Wada Complete 348 Harmonic Dictionary (Orpheum / Haight Ashbury Heritage) -->
  <script src="./geome-wada.js"></script>
  <!-- 2. Studio Motion Engine: Wada OKLab/CIEDE2000 Engine, 8 Character Archetypes, 8 Interaction Modes, Single-Clock MA Renderer -->
  <script src="./studio-motion-engine.js"></script>
  <!-- 3. Infinite-Zoom Living Canvas DAG, 5-Lens Forks, 8-Beat Storyboard, OAuth 2.0 PKCE + Local Bridge + Algebraic Synthesizer, 16-Gate Auditor -->
  <script src="./studio-canvas-oauth.js"></script>
  <!-- 4. Interactive Studio Pro Application Shell & 7 Surfaces -->
  <script src="./studio-ui.js"></script>
</body>
</html>
