FF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/spacemono/v17/i7dMIFZifjKcF5UAWdDRaPpZUFqaHi6WZ3S_Yg.woff2) format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/spacemono/v17/i7dMIFZifjKcF5UAWdDRaPpZUFuaHi6WZ3S_Yg.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1a0827ce-e536-4bdd-912a-0e2b62743a12\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ════════════════════════════════════════\n   * § TYPE\n   * ════════════════════════════════════════ */\n  --font-display: \"Fraunces\", \"Cormorant Garamond\", Georgia, serif;\n  --font-sans:    \"DM Sans\", \"Inter\", system-ui, sans-serif;\n  --font-mono:    \"Space Mono\", \"JetBrains Mono\", ui-monospace, monospace;\n\n  /* Type scale — fluid clamp(min, ideal, max) */\n  --t-display-xl: clamp(3.0rem, 6vw, 4.4rem);   /* hero, cover */\n  --t-display-l:  clamp(2.2rem, 4.5vw, 3.4rem); /* h1 */\n  --t-display:    clamp(1.7rem, 3.5vw, 2.4rem); /* h2 */\n  --t-h3:         clamp(1.25rem, 2vw, 1.5rem);\n  --t-h4:         1.125rem;\n  --t-body:       1rem;\n  --t-small:      0.875rem;\n  --t-meta:       0.75rem;\n  --t-eyebrow:    0.625rem;          /* mono caps, 0.18-0.22em tracking */\n\n  /* Tracking presets — eyebrow / mono uppercase rhythm */\n  --tracking-eyebrow: 0.22em;\n  --tracking-mono:    0.06em;\n  --tracking-display: -0.02em;\n  --tracking-body:    0;\n\n  /* Line-height presets */\n  --lh-tight:    1.1;\n  --lh-display:  1.2;\n  --lh-body:     1.6;\n  --lh-loose:    1.7;\n\n\n  /* ════════════════════════════════════════\n   * § SPACING + RHYTHM\n   * ════════════════════════════════════════ */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --gutter:   clamp(1.5rem, 4vw, 4rem);\n  --content-max: 1100px;\n  --lesson-max:   840px;\n\n  /* Radii */\n  --radius-sm:  6px;\n  --radius:     10px;\n  --radius-lg:  14px;\n  --radius-xl:  20px;\n  --radius-pill: 999px;\n\n\n  /* ════════════════════════════════════════\n   * § MOTION (mirrors motion.css)\n   * ════════════════════════════════════════ */\n  --ease-glaser:   cubic-bezier(0.22, 1, 0.36, 1);   /* house ease */\n  --ease-warm-in:  cubic-bezier(0.4, 0, 0.2, 1);     /* workhorse */\n  --ease-defer:    cubic-bezier(0.25, 0.46, 0.45, 0.94);\n  --ease-collect:  cubic-bezier(0.55, 0, 0.55, 0.2);\n  --ease-rest:     cubic-bezier(0.4, 0, 0.6, 1);\n  --duration-quick:       180ms;\n  --duration-comfortable: 280ms;\n  --duration-deliberate:  480ms;\n  --duration-considered:  720ms;\n\n\n  /* ════════════════════════════════════════\n   * § MARKETING PALETTE — cetiai.co\n   *    deep editorial dark; whale-streak accents.\n   *    Sampled from whale-logo.svg + meta-theme-color.\n   * ════════════════════════════════════════ */\n  --mk-deep-sea:     #1A1F2E;   /* page ground (deeper than ink) */\n  --mk-night-tide:   #262721;   /* meta theme color — alt ground */\n  --mk-bathysphere:  #0F1320;   /* terminal / code surface */\n  --mk-paper:        #F5EFE3;   /* cream ink-on-cream */\n  --mk-paper-soft:   #E8DFCB;   /* surface ivory */\n  --mk-fog:          #B8B0A1;   /* muted text on dark */\n  --mk-rule:         #2A3142;   /* hairline rule on dark */\n\n  /* Whale-streak accents — sampled from whale-logo.svg */\n  --mk-copper:       #A67756;   /* lead — warm metallic */\n  --mk-sage:         #7A9171;   /* counterpoint — botanical */\n  --mk-peach:        #D88B5C;   /* spark — sunset coral */\n  --mk-slate:        #324555;   /* depth — cool ink */\n  --mk-rust:         #8C4A2E;   /* deeper copper for CTA */\n\n  /* Soft accents for illustration / badges */\n  --mk-mist:         #95A8B0;   /* surface cool */\n  --mk-driftwood:    #5C5447;   /* earthen */\n\n\n  /* ════════════════════════════════════════\n   * § ACADEMY PALETTE — learn.cetiai.co\n   *    Four palettes × {light, dark}.\n   *    HSL triples (so Tailwind alpha modifiers work).\n   *    Default look (no class on body) = boardwalk dark.\n   * ════════════════════════════════════════ */\n\n  /* fallback ring + destructive */\n  --ring: 260 40% 55%;\n  --destructive: 8 72% 52%;\n  --destructive-foreground: 40 40% 96%;\n  --input: 0 0% 100% / .08;\n}\n\n\n/* ── 🎡 Boardwalk · light ───────────────────────────────────────── */\n.palette-boardwalk.light, [data-palette=\"boardwalk-light\"] {\n  --background: 44 58% 92%;\n  --foreground: 28 28% 13%;\n  --card:       42 46% 87%;\n  --card-foreground: 28 28% 13%;\n  --muted:      42 18% 92%;\n  --muted-foreground: 28 18% 34%;\n  --border:     260 35% 78%;\n  --primary:    265 45% 78%;\n  --primary-foreground: 262 48% 30%;\n  --secondary:  150 35% 72%;\n  --secondary-foreground: 158 56% 23%;\n  --accent:     10 62% 76%;\n  --accent-foreground: 10 70% 26%;\n  --support:    212 40% 67%;\n  --support-foreground: 212 56% 23%;\n  --primary-edge:   265 45% 52%;\n  --secondary-edge: 150 40% 32%;\n  --accent-edge:    10 62% 43%;\n  --support-edge:   212 50% 42%;\n  --terminal-bg: 42 30% 83%;\n  --terminal-fg: 28 28% 13%;\n  --input: 0 0% 0% / .06;\n}\n\n/* ── 🎡 Boardwalk · dark (default look) ─────────────────────────── */\n.palette-boardwalk.dark, [data-palette=\"boardwalk-dark\"],\nbody:not([class*=\"palette-\"]) {\n  --background: 268 16% 11%;\n  --foreground: 40 62% 96%;\n  --card:       260 22% 17%;\n  --card-foreground: 40 62% 96%;\n  --muted:      268 15% 22%;\n  --muted-foreground: 268 28% 82%;\n  --border: 262 72% 86% / .30;\n  --primary:    263 28% 22%;\n  --primary-foreground: 262 90% 92%;\n  --secondary:  158 18% 15%;\n  --secondary-foreground: 152 72% 82%;\n  --accent:     12 30% 18%;\n  --accent-foreground: 10 88% 80%;\n  --support:    212 30% 18%;\n  --support-foreground: 212 70% 80%;\n  --primary-edge:   262 90% 92%;\n  --secondary-edge: 152 72% 82%;\n  --accent-edge:    10 88% 80%;\n  --support-edge:   212 70% 80%;\n  --terminal-bg: 268 22% 7%;\n  --terminal-fg: 40 62% 96%;\n  --input: 0 0% 100% / .08;\n}\n\n/* ── 🌊 Coastal · light ─────────────────────────────────────────── */\n.palette-coastal.light, [data-palette=\"coastal-light\"] {\n  --background: 48 30% 91%;\n  --foreground: 32 18% 11%;\n  --card: 46 24% 85%;\n  --card-foreground: 32 18% 11%;\n  --muted: 48 18% 90%;\n  --muted-foreground: 32 16% 28%;\n  --border: 170 40% 22% / .20;\n  --primary: 166 36% 72%;  --primary-foreground: 166 55% 22%;\n  --secondary: 14 55% 82%; --secondary-foreground: 14 55% 26%;\n  --accent: 205 52% 78%;   --accent-foreground: 205 70% 20%;\n  --support: 0 24% 72%;    --support-foreground: 0 38% 24%;\n  --primary-edge: 166 50% 42%; --secondary-edge: 14 65% 52%;\n  --accent-edge: 205 60% 48%;  --support-edge: 0 40% 50%;\n  --terminal-bg: 46 20% 82%;   --terminal-fg: 32 18% 11%;\n}\n\n/* ── 🌊 Coastal · dark ──────────────────────────────────────────── */\n.palette-coastal.dark, [data-palette=\"coastal-dark\"] {\n  --background: 192 14% 10%;\n  --foreground: 170 30% 96%;\n  --card: 204 28% 15%;\n  --card-foreground: 170 30% 96%;\n  --muted: 192 14% 20%;\n  --muted-foreground: 170 22% 78%;\n  --border: 165 60% 68% / .30;\n  --primary: 168 28% 13%;  --primary-foreground: 165 72% 82%;\n  --secondary: 8 25% 13%;  --secondary-foreground: 16 85% 86%;\n  --accent: 202 42% 15%;   --accent-foreground: 205 78% 78%;\n  --support: 0 14% 15%;    --support-foreground: 0 62% 88%;\n  --primary-edge: 165 72% 82%;  --secondary-edge: 16 85% 86%;\n  --accent-edge: 205 78% 78%;   --support-edge: 0 62% 88%;\n  --terminal-bg: 200 22% 6%;    --terminal-fg: 170 30% 96%;\n}\n\n/* ── 🌿 Greenhouse · light ──────────────────────────────────────── */\n.palette-greenhouse.light, [data-palette=\"greenhouse-light\"] {\n  --background: 44 30% 91%;\n  --foreground: 40 40% 8%;\n  --card: 42 22% 85%;\n  --card-foreground: 40 40% 8%;\n  --muted: 44 16% 90%;\n  --muted-foreground: 32 20% 28%;\n  --border: 90 30% 20% / .18;\n  --primary: 80 26% 52%;  --primary-foreground: 85 65% 12%;\n  --secondary: 14 42% 59%; --secondary-foreground: 14 58% 12%;\n  --accent: 148 20% 52%;   --accent-foreground: 148 40% 12%;\n  --support: 30 12% 67%;   --support-foreground: 30 20% 18%;\n  --primary-edge: 80 40% 32%;  --secondary-edge: 14 56% 36%;\n  --accent-edge: 148 38% 30%;  --support-edge: 30 22% 38%;\n  --terminal-bg: 42 18% 82%;   --terminal-fg: 40 40% 8%;\n}\n\n/* ── 🌿 Greenhouse · dark ───────────────────────────────────────── */\n.palette-greenhouse.dark, [data-palette=\"greenhouse-dark\"] {\n  --background: 72 14% 7%;\n  --foreground: 40 50% 94%;\n  --card: 78 18% 12%;\n  --card-foreground: 40 50% 94%;\n  --muted: 72 12% 20%;\n  --muted-foreground: 42 28% 78%;\n  --border: 90 62% 66% / .30;\n  --primary: 96 32% 12%;   --primary-foreground: 90 72% 80%;\n  --secondary: 22 32% 12%; --secondary-foreground: 22 85% 82%;\n  --accent: 144 32% 12%;   --accent-foreground: 145 58% 72%;\n  --support: 36 20% 13%;   --support-foreground: 40 36% 84%;\n  --primary-edge: 90 72% 80%;   --secondary-edge: 22 85% 82%;\n  --accent-edge: 145 58% 72%;   --support-edge: 40 36% 84%;\n  --terminal-bg: 72 20% 4%;     --terminal-fg: 40 50% 94%;\n}\n\n/* ── ⚡ Neo Sage · light ────────────────────────────────────────── */\n.palette-neosage.light, [data-palette=\"neosage-light\"] {\n  --background: 48 24% 95%;\n  --foreground: 8 18% 11%;\n  --card: 48 22% 90%;\n  --card-foreground: 8 18% 11%;\n  --muted: 48 16% 92%;\n  --muted-foreground: 32 14% 30%;\n  --border: 262 44% 20% / .18;\n  --primary: 265 32% 65%;   --primary-foreground: 262 60% 24%;\n  --secondary: 68 54% 54%;  --secondary-foreground: 72 100% 11%;\n  --accent: 36 70% 66%;     --accent-foreground: 36 100% 16%;\n  --support: 28 6% 63%;     --support-foreground: 28 10% 18%;\n  --primary-edge: 265 46% 38%;  --secondary-edge: 68 72% 25%;\n  --accent-edge: 36 80% 31%;    --support-edge: 28 14% 30%;\n  --terminal-bg: 48 18% 86%;    --terminal-fg: 8 18% 11%;\n}\n\n/* ── ⚡ Neo Sage · dark ─────────────────────────────────────────── */\n.palette-neosage.dark, [data-palette=\"neosage-dark\"] {\n  --background: 260 16% 8%;\n  --foreground: 48 30% 96%;\n  --card: 260 18% 13%;\n  --card-foreground: 48 30% 96%;\n  --muted: 260 14% 22%;\n  --muted-foreground: 260 22% 82%;\n  --border: 262 86% 82% / .30;\n  --primary: 258 38% 15%;   --primary-foreground: 262 92% 90%;\n  --secondary: 72 65% 8%;   --secondary-foreground: 68 88% 76%;\n  --accent: 36 60% 12%;     --accent-foreground: 36 88% 72%;\n  --support: 280 8% 13%;    --support-foreground: 260 22% 84%;\n  --primary-edge: 262 92% 90%;   --secondary-edge: 68 88% 76%;\n  --accent-edge: 36 88% 72%;     --support-edge: 260 22% 84%;\n  --terminal-bg: 260 22% 5%;     --terminal-fg: 48 30% 96%;\n}\n\n\n/* ════════════════════════════════════════════════════════════════════\n   § SEMANTIC ROLE ALIASES\n   Use these in component CSS — never raw hex, never `--primary` directly\n   if you want palette-aware behavior.\n   ──────────────────────────────────────────────────────────────────── */\n\n:root {\n  /* Surfaces */\n  --bg:           hsl(var(--background));\n  --surface:      hsl(var(--card));\n  --raised:       hsl(var(--muted));\n  --rule:         hsl(var(--border));\n\n  /* Text */\n  --ink:          hsl(var(--foreground));\n  --muted-ink:    hsl(var(--muted-foreground));\n  --dim:          hsl(var(--muted-foreground) / 0.7);\n\n  /* Brand \"gold\" — maps to primary-edge so it pops in dark, grounds in light */\n  --gold:         hsl(var(--primary-edge));\n  --gold-soft:    hsl(var(--primary-edge) / 0.18);\n\n  /* Terminal */\n  --term-bg:      hsl(var(--terminal-bg));\n  --term-fg:      hsl(var(--terminal-fg));\n\n  /* Role accent shorthands */\n  --primary-fill: hsl(var(--primary));\n  --primary-ink:  hsl(var(--primary-foreground));\n  --primary-glow: hsl(var(--primary-edge));\n\n  --accent-fill:  hsl(var(--accent));\n  --accent-ink:   hsl(var(--accent-foreground));\n  --accent-glow:  hsl(var(--accent-edge));\n\n  --secondary-fill: hsl(var(--secondary));\n  --secondary-ink:  hsl(var(--secondary-foreground));\n  --secondary-glow: hsl(var(--secondary-edge));\n\n  --support-fill: hsl(var(--support));\n  --support-ink:  hsl(var(--support-foreground));\n  --support-glow: hsl(var(--support-edge));\n}\n\n\n/* ════════════════════════════════════════════════════════════════════\n   § SEMANTIC TYPE STYLES — h1, h2, body, eyebrow, mono, etc.\n   Pages that need quick canonical text styling apply these classes.\n   ──────────────────────────────────────────────────────────────────── */\n\n.ceti-h1, h1.display, .ceti-display {\n  font-family: \"Fraunces\", \"Cormorant Garamond\", Georgia, serif;\n  font-weight: 300;\n  font-style: italic;\n  font-size: clamp(2.2rem, 4.5vw, 3.4rem);\n  line-height: 1.2;\n  letter-spacing: -0.02em;\n  color: var(--ink);\n  margin: 0 0 16px;\n}\n.ceti-h1-xl {\n  font-family: \"Fraunces\", \"Cormorant Garamond\", Georgia, serif;\n  font-weight: 300;\n  font-style: italic;\n  font-size: clamp(3.0rem, 6vw, 4.4rem);\n  line-height: 1.05;\n  letter-spacing: -0.02em;\n  color: var(--ink);\n}\n.ceti-h2 {\n  font-family: \"Fraunces\", \"Cormorant Garamond\", Georgia, serif;\n  font-weight: 300;\n  font-style: italic;\n  font-size: clamp(1.7rem, 3.5vw, 2.4rem);\n  line-height: 1.2;\n  letter-spacing: -0.02em;\n  color: var(--ink);\n  margin: 0 0 12px;\n}\n.ceti-h3 {\n  font-family: \"DM Sans\", \"Inter\", system-ui, sans-serif;\n  font-weight: 600;\n  font-size: clamp(1.25rem, 2vw, 1.5rem);\n  line-height: 1.3;\n  color: var(--ink);\n  margin: 0 0 12px;\n}\n.ceti-h4 {\n  font-family: \"DM Sans\", \"Inter\", system-ui, sans-serif;\n  font-weight: 600;\n  font-size: 1.125rem;\n  color: var(--ink);\n}\n.ceti-body, p {\n  font-family: \"DM Sans\", \"Inter\", system-ui, sans-serif;\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.6;\n  color: var(--ink);\n}\n.ceti-lede {\n  font-family: \"DM Sans\", \"Inter\", system-ui, sans-serif;\n  font-size: clamp(1rem, 1.6vw, 1.15rem);\n  line-height: 1.6;\n  color: var(--muted-ink);\n  max-width: 56ch;\n}\n.ceti-eyebrow {\n  font-family: \"Space Mono\", \"JetBrains Mono\", ui-monospace, monospace;\n  font-size: 0.625rem;\n  font-weight: 700;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--muted-ink);\n}\n.ceti-mono, code, kbd, samp, pre {\n  font-family: \"Space Mono\", \"JetBrains Mono\", ui-monospace, monospace;\n  font-size: 0.92em;\n}\n.ceti-meta {\n  font-family: \"Space Mono\", \"JetBrains Mono\", ui-monospace, monospace;\n  font-size: 0.75rem;\n  letter-spacing: 0.06em;\n  color: var(--dim);\n}\n\n/* \"display-italic\" — the signature class. Any element with it picks up\n   Fraunces 300 italic. Use sparingly: every diagram/card title gets it. */\n.display-italic {\n  font-family: \"Fraunces\", \"Cormorant Garamond\", Georgia, serif;\n  font-weight: 300;\n  font-style: italic;\n  letter-spacing: -0.01em;\n}\n\n\n/* ════════════════════════════════════════════════════════════════════\n   § BASE — minimal reset + body wiring\n   ──────────────────────────────────────────────────────────────────── */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nhtml:has(body.dark), body.dark { color-scheme: dark; }\nhtml:has(body.light), body.light { color-scheme: light; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: \"DM Sans\", \"Inter\", system-ui, sans-serif;\n  font-size: 1rem;\n  line-height: 1.6;\n  min-height: 100vh;\n  -webkit-font-smoothing: antialiased;\n  font-feature-settings: \"ss01\", \"cv11\";\n  transition: background-color 0.3s ease, color 0.3s ease;\n}\n<\u002Fstyle>\n<style>/* motion.css — the warm motion vocabulary\n * Drop into :root, consume in component CSS via var(--ease-*).\n * Includes IntersectionObserver helper at the bottom.\n */\n\n:root {\n  /* Eases */\n  --ease-glaser:   cubic-bezier(0.22, 1, 0.36, 1);     /* house ease */\n  --ease-warm-in:  cubic-bezier(0.4, 0, 0.2, 1);       /* workhorse */\n  --ease-defer:    cubic-bezier(0.25, 0.46, 0.45, 0.94);/* arrivals */\n  --ease-collect:  cubic-bezier(0.55, 0, 0.55, 0.2);   /* departures */\n  --ease-rest:     cubic-bezier(0.4, 0, 0.6, 1);       /* symmetry */\n\n  /* Durations */\n  --duration-quick:        180ms;  /* hover, focus */\n  --duration-comfortable:  280ms;  /* default */\n  --duration-deliberate:   480ms;  /* section reveals */\n  --duration-considered:   720ms;  /* hero set-pieces */\n}\n\n/* ────────────────────────────────────────\n * REVEAL PATTERN — fade-in-on-scroll\n * Apply class .reveal-fade to elements; observer below toggles .is-visible.\n * ──────────────────────────────────────── */\n\n.reveal-fade {\n  opacity: 0;\n  transform: translateY(8px);\n  transition:\n    opacity 480ms cubic-bezier(0.25, 0.46, 0.45, 0.94),\n    transform 480ms cubic-bezier(0.25, 0.46, 0.45, 0.94);\n  will-change: opacity, transform;\n}\n.reveal-fade.is-visible {\n  opacity: 1;\n  transform: translateY(0);\n}\n\n/* Mobile: drop the transform — only fade. Reduces motion-sickness on small screens. */\n@media (max-width: 720px) {\n  .reveal-fade {\n    transform: none;\n    transition: opacity 480ms cubic-bezier(0.25, 0.46, 0.45, 0.94);\n  }\n  .reveal-fade.is-visible {\n    transform: none;\n  }\n}\n\n/* ────────────────────────────────────────\n * REDUCED MOTION GUARD\n * Keep opacity for orientation; kill transforms for safety.\n * ──────────────────────────────────────── */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 280ms !important;\n    transition-property: opacity, color, background-color, border-color !important;\n  }\n  .reveal-fade,\n  .reveal-fade.is-visible {\n    transform: none !important;\n  }\n}\n<\u002Fstyle>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1440\"><meta name=\"hz:canvas-height\" content=\"2300\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/dmsans/v17/rP2Yp2ywxg089UriI5-g4vlH9VoD8Cmcqbu6-K6z9mXgjU0.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fd9ba0c6-a01a-4fd7-bd51-b0d262b6a529\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(https://f ,0,.2,1),border-color 180ms cubic-bezier(.4,0,.2,1),filter 180ms cubic-bezier(.4,0,.2,1)}\nbutton:hover{filter:brightness(1.04)}\nbutton:active{filter:brightness(.95)}\nbutton:focus-visible,a:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(140,74,46,.35)}\na{color:#8C4A2E}a:hover{color:#5E2F1B}\ninput[type=range]{accent-color:#8C4A2E}\n@media (prefers-reduced-motion: reduce){button{transition:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div ref=\"{{rootRef}}\" style=\"min-height: 100vh; background: #F5EFE3; color: #1A1F2E; font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5;\" data-canvas-width=\"1440\" data-canvas-height=\"2300\" data-document-role=\"page\" data-label=\"Explorer — three fork lenses, storylines, elements, whale\">\n<div style=\"max-width: 1320px; margin: 0 auto; padding: 40px clamp(16px, 4vw, 56px) 96px; display: flex; flex-direction: column; gap: 26px; box-sizing: border-box;\">\n\n<header style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between;\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 780px;\">\n<div style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #5A5F6B;\">Motion Atlas · 171 nodes from Notion · Sanzo Wada × watercolor · one whale<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: clamp(36px, 5vw, 58px); line-height: 1.05; letter-spacing: -0.02em;\">Fork your way to a <span style=\"color: #8C4A2E;\">motion<\u002Fspan> taste.<\u002Fh1>\n<p style=\"margin: 0; color: #4A4F5B; max-width: 660px;\">Three ways to fork — by look, by use, by story. Every proof stars the same little whale, runs as a pure function of time, is painted once per palette and finished with one grain pass.<\u002Fp>\n<\u002Fdiv>\n<nav aria-label=\"Views\" style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n<sc-for list=\"{{views}}\" as=\"v\" hint-placeholder-count=\"6\">\n<button sc-camel-on-click=\"{{v.go}}\" aria-pressed=\"{{v.pressed}}\" style=\"{{v.style}}\">{{v.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fnav>\n<\u002Fheader>\n\n<section aria-label=\"Palette, feel and tweaks\" style=\"display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; background: #FBF7EF; border: 1px solid rgba(26,31,46,.12); border-radius: 14px;\">\n<div style=\"display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: baseline;\">\n<div style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #5A5F6B;\">Palette · Sanzo Wada, A Dictionary of Color Combinations · {{palCount}} plates<\u002Fdiv>\n<div style=\"font-family: 'Space Mono', monospace; font-size: 12px; color: #4A4F5B;\">{{palLine}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 8px;\">\n<sc-for list=\"{{pals}}\" as=\"p\" hint-placeholder-count=\"12\">\n<button sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.pressed}}\" aria-label=\"{{p.aria}}\" style=\"{{p.style}}\">\n<span style=\"display: flex; height: 22px; border-radius: 4px; overflow: hidden; border: 1px solid rgba(26,31,46,.10);\">\n<sc-for list=\"{{p.sw}}\" as=\"s\" hint-placeholder-count=\"4\"><span style=\"{{s.style}}\"><\u002Fspan><\u002Fsc-for>\n<\u002Fspan>\n<span style=\"font-size: 12px; font-weight: 600; line-height: 1.2;\">{{p.name}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;\">\n<div role=\"group\" aria-label=\"Feel\" style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<sc-for list=\"{{feels}}\" as=\"f\" hint-placeholder-count=\"6\">\n<button sc-camel-on-click=\"{{f.pick}}\" aria-pressed=\"{{f.pressed}}\" style=\"{{f.style}}\">{{f.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{togglePlay}}\" style=\"min-height: 40px; padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(26,31,46,.2); background: #1A1F2E; color: #F5EFE3; font-size: 14px; font-weight: 600;\">{{playLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 12px; color: #4A4F5B;\">{{feelNote}}<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px 18px; padding-top: 12px; border-top: 1px solid rgba(26,31,46,.10);\">\n<div style=\"display: flex; flex-direction: column; gap: 4px;\">\n<label for=\"tw-speed\" style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4F5B;\">Speed · {{speedLabel}}<\u002Flabel>\n<input id=\"tw-speed\" type=\"range\" min=\"25\" max=\"200\" step=\"5\" value=\"{{speedVal}}\" sc-camel-on-change=\"{{onSpeed}}\" style=\"min-height: 32px;\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px;\">\n<label for=\"tw-grain\" style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4F5B;\">Grain · {{grainLabel}}<\u002Flabel>\n<input id=\"tw-grain\" type=\"range\" min=\"0\" max=\"50\" step=\"1\" value=\"{{grainVal}}\" sc-camel-on-change=\"{{onGrain}}\" style=\"min-height: 32px;\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px;\">\n<label for=\"tw-wob\" style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4F5B;\">Line wobble · {{wobLabel}}<\u002Flabel>\n<input id=\"tw-wob\" type=\"range\" min=\"0\" max=\"200\" step=\"5\" value=\"{{wobVal}}\" sc-camel-on-change=\"{{onWob}}\" style=\"min-height: 32px;\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px;\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4F5B;\">Ground<\u002Fspan>\n<div role=\"group\" aria-label=\"Ground\" style=\"display: flex; gap: 4px; flex-wrap: wrap;\">\n<sc-for list=\"{{grounds}}\" as=\"gd\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{gd.pick}}\" aria-pressed=\"{{gd.pressed}}\" style=\"{{gd.style}}\">{{gd.label}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px;\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4F5B;\">Whale<\u002Fspan>\n<div style=\"display: flex; gap: 4px; flex-wrap: wrap;\">\n<button sc-camel-on-click=\"{{toggleGuide}}\" aria-pressed=\"{{guidePressed}}\" style=\"{{guideStyle}}\">Guide in every proof<\u002Fbutton>\n<button sc-camel-on-click=\"{{toggleStreaks}}\" aria-pressed=\"{{streaksPressed}}\" style=\"{{streaksStyle}}\">Colour streaks<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{isFork}}\" hint-placeholder-val=\"{{true}}\">\n<section aria-label=\"Fork explorer\" style=\"display: flex; flex-direction: column; gap: 20px;\">\n<div style=\"display: flex; gap: 14px; align-items: center; flex-wrap: wrap;\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #5A5F6B;\">Fork by<\u002Fspan>\n<div role=\"group\" aria-label=\"Fork lens\" style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n<sc-for list=\"{{lenses}}\" as=\"ln\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ln.pick}}\" aria-pressed=\"{{ln.pressed}}\" style=\"{{ln.style}}\">{{ln.label}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size: 14px; color: #4A4F5B;\">{{lensNote}}<\u002Fspan>\n<\u002Fdiv>\n<ol aria-label=\"Tiers\" style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0;\">\n<sc-for list=\"{{tiers}}\" as=\"tr\" hint-placeholder-count=\"5\">\n<li style=\"{{tr.style}}\"><span style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.18em;\">TIER {{tr.n}}<\u002Fspan><span style=\"font-size: 13px; font-weight: 600;\">{{tr.label}}<\u002Fspan><\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<div style=\"display: flex; gap: 6px; flex-wrap: wrap; align-items: center;\">\n<sc-for list=\"{{crumbs}}\" as=\"c\" hint-placeholder-count=\"2\">\n<button sc-camel-on-click=\"{{c.go}}\" style=\"min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(26,31,46,.16); background: transparent; color: #1A1F2E; font-size: 13px;\">{{c.label}}<\u002Fbutton>\n<sc-if value=\"{{c.notLast}}\" hint-placeholder-val=\"{{true}}\"><span aria-hidden=\"true\" style=\"color: #8A8F9B;\">/<\u002Fspan><\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<sc-if value=\"{{showFork}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: flex; flex-direction: column; gap: 8px;\">\n<h2 style=\"margin: 0; font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -0.02em;\">{{forkQ}}<\u002Fh2>\n<p style=\"margin: 0; color: #4A4F5B; max-width: 740px;\">{{forkSub}}<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px;\">\n<sc-for list=\"{{forkOpts}}\" as=\"o\" hint-placeholder-count=\"2\">\n<article style=\"display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 20px; background: #FBF7EF; border: 1px solid rgba(26,31,46,.12); border-radius: 14px; box-shadow: 0 1px 2px rgba(26,31,46,.06), 0 8px 24px -12px rgba(26,31,46,.10);\">\n<canvas data-proof=\"{{o.proof}}\" data-pal=\"{{palIdx}}\" width=\"960\" height=\"600\" role=\"img\" aria-label=\"{{o.aria}}\" style=\"width: 100%; aspect-ratio: 16 / 10; display: block; border-radius: 10px; background: #FBF3E6;\"><\u002Fcanvas>\n<div style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #8C4A2E;\">{{o.tag}}<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: 30px; letter-spacing: -0.02em;\">{{o.title}}<\u002Fh3>\n<p style=\"margin: 0; color: #2E3340;\">{{o.body}}<\u002Fp>\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 12px; color: #4A4F5B;\">{{o.leads}}<\u002Fp>\n<div><button sc-camel-on-click=\"{{o.go}}\" style=\"min-height: 44px; padding: 10px 20px; border-radius: 10px; border: 1px solid #8C4A2E; background: #8C4A2E; color: #FBF7EF; font-size: 15px; font-weight: 600;\">Take this branch<\u002Fbutton><\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{showRootExtras}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px;\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; background: #FBF7EF; border: 1px solid rgba(26,31,46,.12); border-radius: 14px;\">\n<div style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #5A5F6B;\">Read before you pick<\u002Fdiv>\n<p style=\"margin: 0;\">The Atlas field guide in twelve lines, and the twelve gated stages every piece moves through.<\u002Fp>\n<div><button sc-camel-on-click=\"{{toggleFieldGuide}}\" aria-expanded=\"{{guideOpen}}\" style=\"min-height: 40px; padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(26,31,46,.2); background: transparent; color: #1A1F2E; font-size: 14px; font-weight: 600;\">{{guideLabel}}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; background: #FBF7EF; border: 1px solid rgba(140,74,46,.45); border-radius: 14px;\">\n<div style=\"font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #8C4A2E;\">Known drift · from the Atlas<\u002Fdiv>\n<p style=\"margin: 0;\">{{driftText}}<\u002Fp>\n<p style=\"margin: 0; font-size: 14px; color: #4A4F5B;\">A whale invites exactly that drift, so this one swims through paper sky and noise — never open sea. Water stays a deliberate choice, not a default.<\u002Fp>\n<a href=\"{{driftUrl}}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 14px;\">Open the pitfall in Notion<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{guideOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px;\">\n<ol style=\"margin: 0; padding: 18px 20px 18px 40px; background: #FBF7EF; border: 1px solid rgba(26,31,46,.12); border-radius: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px;\">\n<sc-for list=\"{{ideas}}\" as=\"idea\" hint-placeholder-count=\"6\"><li>{{idea.t}}<\u002Fli><\u002Fsc-for>\n<\u002Fol>\n<ol style=\"margin: 0; padding: 18px 20px; list-style: none; background: #FBF7EF; border: 1px solid rgba(26,31,46,.12); border-radius: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px;\">\n<sc-for list=\"{{stages}}\" as=\"sg\" hint-placeholder-count=\"6\"><li style=\"display: flex; flex-direction: column; gap: 2px;\"><a href=\"{{sg.u}}\" target=\"_blank\" rel=\"noopener\" style=\"font-weight: 600;\">{{sg.t}}<\u002Fa><span style=\"color: #4A4F5B;\">{{sg.s}}<\u002Fspan><\u002Fli><\u002Fsc-for>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<sc-if value=\"{{showLeaf}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 8px;\">\n<h2 style=\"margin: 0; font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -0.02em;\">{{leafTitle}}<\u002Fh2>\n<p style=\"margin: 0; color: #4A4F5B; max-width: 740px;\">{{leafSub}} e-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px;\">\n<sc-for list=\"{{g.items}}\" as=\"si\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 14px; background: #FBF7EF; border: 1px solid rgba(26,31,46,.12); border-radius: 12px;\">\n<canvas data-proof=\"{{si.key}}\" data-pal=\"{{palIdx}}\" width=\"560\" height=\"350\" role=\"img\" aria-label=\"{{si.aria}}\" style=\"width: 100%; aspect-ratio: 16 / 10; display: block; border-radius: 8px; background: #FBF3E6;\"><\u002Fcanvas>\n<div style=\"font-weight: 600; font-size: 14px; line-height: 1.3;\">{{si.title}}<\u002Fdiv>\n<p style=\"margin: 0; font-size: 13px; color: #4A4F5B;\">{{si.lever}}<\u002Fp>\n<div><button sc-camel-on-click=\"{{si.open}}\" style=\"min-height: 36px; padding: 6px 14px; border-radius: 10px; border: 1px solid rgba(26,31,46,.22); background: transparent; color: #1A1F2E; font-size: 13px; font-weight: 600;\">Open proof<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{isMatrix}}\" hint-placeholder-val=\"{{false}}\">\n<section aria-label=\"Palette matrix\" style=\"display: flex; flex-direction: column; gap: 18px;\">\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<h2 style=\"margin: 0; font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -0.02em;\">One proof, every palette.<\u002Fh2>\n<p style=\"margin: 0; color: #4A4F5B; max-width: 760px;\">Each plate is a Sanzo Wada combination on the ground you picked above. The darkest swatch becomes the ink; every ink clears 7:1 on the Atlas paper.<\u002Fp>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Proof for the matrix\" style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n<sc-for list=\"{{mStyles}}\" as=\"ms\" hint-placeholder-count=\"8\"><button sc-camel-on-click=\"{{ms.pick}}\" aria-pressed=\"{ gin: 0; font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: clamp(28px, 3.4vw, 40px); letter-spacing: -0.02em;\">What you kept.<\u002Fh2>\n<p style=\"margin: 0; color: #4A4F5B; max-width: 760px;\">Styles and storylines keep the palette, feel and tweaks you had on. Elements ride along. The brief turns all of it into the Atlas stage-one inputs block.<\u002Fp>\n<\u002Fdiv>\n<sc-if value=\"{{trayEmpty}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"margin: 0; padding: 18px 20px; background: #FBF7EF; border: 1px dashed rgba(26,31,46,.25); border-radius: 12px;\">Nothing kept yet. Press Keep on a style or storyline, or Add on an element.<\u002Fp>\n<\u002Fsc-if>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px;\">\n<sc-for list=\"{{trayItems}}\" as=\"ti\" hint-placeholder-count=\"2\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 14px; background: #FBF7EF; border: 1px solid rgba(26,31,46,.12); border-radius: 12px;\">\n<canvas data-proof=\"{{ti.key}}\" data-pal=\"{{ti.palIdx}}\" width=\"560\" height=\"350\" role=\"img\" aria-label=\"{{ti.aria}}\" style=\"width: 100%; aspect-ratio: 16 / 10; display: block; border-radius: 8px; background: #FBF3E6;\"><\u002Fcanvas>\n<div style=\"font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #8C4A2E;\">{{ti.kind}}<\u002Fdiv>\n<div style=\"font-weight: 600; font-size: 14px;\">{{ti.title}}<\u002Fdiv>\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 11px; color: #4A4F5B;\">{{ti.meta}}<\u002Fp>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n<button sc-camel-on-click=\"{{ti.open}}\" style=\"min-height: 36px; padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(26,31,46,.22); background: transparent; color: #1A1F2E; font-size: 13px; font-weight: 600;\">Open<\u002Fbutton>\n<button sc-camel-on-click=\"{{ti.remove}
